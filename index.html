<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Игры — Вова (версия 55)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d}
  body{
    background:radial-gradient(circle at 50% -10%,#16223f 0%,#080b14 55%,#05070d 100%);
    color:#e8f1ff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #bg{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  #bg span{
    font-size:clamp(36px,12vw,150px);font-weight:900;line-height:.92;text-align:center;
    text-transform:uppercase;letter-spacing:.02em;transform:rotate(-12deg);
    color:rgba(255,255,255,.16);text-shadow:0 0 90px rgba(255,255,255,.14);
  }
  
  /* Экран входа */
  #startScreen {
    position: fixed; inset: 0; z-index: 9999; background: #05070d;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }

  #wrap{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:16px;align-items:center;max-width:100vw}
  #hud{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;
       font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8ea6c9}
  #hud b{color:#fff;font-weight:700;font-size:15px;letter-spacing:0}
  #hudPlayer{color:#46e6a0;font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%}
  #stage{position:relative;line-height:0}
  canvas{display:block;border-radius:18px;touch-action:none;
    box-shadow:0 0 0 1px rgba(120,180,255,.16),0 24px 70px -24px rgba(40,140,255,.75)}
  
  #overlay{
    position:absolute;inset:0;display:none; /* Скрыто по умолчанию */
    flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:20px;text-align:center;border-radius:18px;
    background:rgba(6,10,20,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;transition:opacity .2s ease;z-index:10;
  }
  #overlay.show{opacity:1;pointer-events:auto}
  
  #ov-title{margin:0;font-size:clamp(20px,5.6vw,28px);
    color:#46e6a0; text-shadow:0 0 15px rgba(70,230,160,.4); font-weight:800;}
    
  #ov-text{margin:0;font-size:14px;line-height:1.55;color:#a9bfdd;max-height:44vh;overflow:auto;width:100%}
  #ov-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;margin-top:4px}
  .btn{
    appearance:none;border:1px solid rgba(120,180,255,.35);
    background:rgba(70,140,255,.14);color:#e8f1ff;
    padding:10px 18px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s,border-color .15s,transform .08s;
    pointer-events: auto; width: 100%; max-width: 280px;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,rgba(70,230,160,.3),rgba(58,168,255,.3));border-color:rgba(70,230,160,.5)}
  .btn.ghost{background:transparent;color:#8ea6c9;border-color:rgba(120,180,255,.2)}
  .btn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.45);color:#ffb3c1}
  .btn.wide{width:100%;max-width:260px;padding:15px;font-size:16px;}
  .name-input{
    width:100%;max-width:260px;padding:12px 14px;border-radius:12px;
    border:1px solid rgba(120,180,255,.35);background:rgba(10,16,30,.85);
    color:#fff;font:inherit;font-size:16px;text-align:center;outline:none;
    margin-bottom: 10px;
  }
  .name-input:focus{border-color:rgba(70,230,160,.7);box-shadow:0 0 0 3px rgba(70,230,160,.15)}
  
  .stats{width:100%;border-collapse:collapse;font-size:13px}
  .stats th,.stats td{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(120,180,255,.1)}
  .stats th{color:#8ea6c9;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
            position:sticky;top:0;background:rgba(6,10,20,.95)}
  .stats td{color:#e8f1ff}
  .stats tbody tr:first-child td{color:#46e6a0;font-weight:700}
  .stats td.num{text-align:right;font-variant-numeric:tabular-nums}

  .alley{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;padding:4px 2px}
  .alley-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:14px;
    border:1px solid rgba(120,180,255,.2);
    background:rgba(10,16,30,.6);
  }
  .alley-num{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;
    background:rgba(70,140,255,.16);color:#8ea6c9;
  }
  .alley-name{font-size:15px;font-weight:700;color:#fff;line-height:1.25}
  .alley-sub{font-size:12px;color:#8ea6c9;margin-top:2px}
  .alley-item.dev{border-color:rgba(70,230,160,.45);background:rgba(70,230,160,.08)}
  .alley-item.dev .alley-num{background:linear-gradient(135deg,#46e6a0,#3aa8ff);color:#06281f}
  .alley-item.empty{opacity:.85}

  /* Управление для Танков */
  #tank-controls {
    position:absolute; inset:0; pointer-events:none; display:none; z-index:5;
  }
  #tank-controls.active { display:block; }
  .d-pad {
    position:absolute; bottom:20px; left:20px;
    display:grid; grid-template-columns:repeat(3, 50px); grid-template-rows:repeat(3, 50px);
    gap:5px; pointer-events:auto;
  }
  .d-pad button {
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4);
    border-radius:10px; color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:none;
  }
  .d-pad button:active { background:rgba(255,255,255,0.5); }
  .d-pad .up { grid-column:2; grid-row:1; }
  .d-pad .left { grid-column:1; grid-row:2; }
  .d-pad .right { grid-column:3; grid-row:2; }
  .d-pad .down { grid-column:2; grid-row:3; }
  
  #fire-btn {
    position:absolute; bottom:40px; right:30px; width:80px; height:80px;
    border-radius:50%; background:rgba(255,77,109,0.3); border:2px solid rgba(255,77,109,0.6);
    color:#fff; font-size:16px; font-weight:bold; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:none;
  }
  #fire-btn:active { background:rgba(255,77,109,0.7); }
</style>
</head>
<body>

<!-- Экран входа (перекрывает всё) -->
<div id="startScreen">
  <h1 style="color:#46e6a0; font-size:28px; margin-bottom:10px; text-align:center;">Вход в игру</h1>
  <p style="color:#8ea6c9; font-size:12px; margin-bottom:20px; text-align:center;">Если имени нет — создастся новый аккаунт.<br>Если имя занято — введи свой пароль.</p>
  
  <input id="nameInput" class="name-input" maxlength="16" placeholder="Твоё имя" autocomplete="off">
  <input id="passInput" type="password" class="name-input" maxlength="20" placeholder="Пароль" autocomplete="off">
  
  <button type="button" class="btn ghost wide" onclick="startGame()" style="background:rgba(70,140,255,.2); margin-top:10px;">ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ</button>
</div>

<div id="bg"><span>Вова<br>разработчик<br>этой игры</span></div>

<div id="wrap">
  <div id="hud">
    <span id="hudPlayer">—</span>
    <span>Счёт <b id="score">0</b></span>
    <span>Рекорд <b id="best">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c" style="display:none;"></canvas>
    
    <div id="tank-controls">
      <div class="d-pad">
        <button class="up" onpointerdown="event.preventDefault(); tankInput('up', true)" onpointerup="tankInput('up', false)" onpointerleave="tankInput('up', false)">▲</button>
        <button class="left" onpointerdown="event.preventDefault(); tankInput('left', true)" onpointerup="tankInput('left', false)" onpointerleave="tankInput('left', false)">◀</button>
        <button class="right" onpointerdown="event.preventDefault(); tankInput('right', true)" onpointerup="tankInput('right', false)" onpointerleave="tankInput('right', false)">▶</button>
        <button class="down" onpointerdown="event.preventDefault(); tankInput('down', true)" onpointerup="tankInput('down', false)" onpointerleave="tankInput('down', false)">▼</button>
      </div>
      <button id="fire-btn" onpointerdown="event.preventDefault(); tankFire()">ОГОНЬ</button>
    </div>

    <div id="overlay">
      <h1 id="ov-title">Игра</h1>
      <div id="ov-text"></div>
      <div id="ov-actions"></div>
    </div>
  </div>
</div>

<script>
  var store = {
    get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
    remove: function(k) { try { localStorage.removeItem(k); } catch(e) {} }
  };

  var db = null; 
  var canvas, ctx, overlay, ovTitle, ovText, ovActions, scoreEl, bestEl, hudPlayer;
  var tankControls;

  var currentPlayer = '';
  var players = {}; 
  var state = 'name';
  var currentScreen = null;

  // ФИЗИЧЕСКОЕ УСТРОЙСТВО (не меняется)
  var physicalDeviceId = store.get('snake.physicalDeviceId') || 'dev_' + Math.random().toString(36).substring(2, 10);
  store.set('snake.physicalDeviceId', physicalDeviceId);
  
  // ID АККАУНТА (к которому привязаны очки)
  var deviceId = physicalDeviceId;

  var px = 400, cell = 20, GRID = 20;
  var particles = [];
  var loopStarted = false;
  var lastTime = 0;

  var snake, dir, queue, food, score, acc, stepMs;
  var flappyBird = { x: 50, y: 150, vy: 0, gravity: 0.25, jump: -4.5, size: 20 };
  var flappyPipes = [], flappyScore = 0, flappyState = 'ready', flappySpeed = 2;

  var tankPlayer = { x: 200, y: 200, w: 20, h: 20, speed: 120, dir: 'up', cooldown: 0 };
  var tankEnemies = [];
  var tankBullets = [];
  var tankWalls = [];
  var tankScore = 0;
  var tankKeys = { up: false, down: false, left: false, right: false };

  function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(ts) { var d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}); }

  var actx = null;
  function beep(freq, dur, type, vol) {
    type = type || 'sine'; vol = vol || 0.05;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function showScreen(title, textHTML, actionsHTML) {
    ovTitle.textContent = title;
    ovText.innerHTML = textHTML;
    ovActions.innerHTML = actionsHTML;
    overlay.style.display = 'flex';
    overlay.classList.add('show');
    if(tankControls) tankControls.classList.remove('active');
  }
  
  function hideOverlay() { 
    overlay.classList.remove('show'); 
    overlay.style.display = 'none';
  }

  function updateHud() {
    hudPlayer.textContent = currentPlayer || '—';
    var p = players[currentPlayer];
    bestEl.textContent = p ? p.best : 0;
    scoreEl.textContent = state === 'tanks' ? tankScore : (score || 0);
  }

  // --- РЕГИСТРАЦИЯ И ВХОД ---
  window.startGame = function() {
    var inputName = document.getElementById('nameInput');
    var inputPass = document.getElementById('passInput');
    var name = inputName ? inputName.value.trim().replace(/\s+/g, ' ').slice(0, 16) : '';
    var pass = inputPass ? inputPass.value.trim().slice(0, 20) : '';
    
    if (!name || !pass) {
      alert('Введи Имя и Пароль!');
      return;
    }

    if (!db) {
      alert('Нет доступа к интернету (Firebase). Играть можно, но рекорды не сохранятся.');
      deviceId = physicalDeviceId;
      enterGame(name);
      return;
    }

    var btn = document.querySelector('#startScreen button');
    btn.textContent = 'Загрузка...';

    // Проверяем наличие пользователя в базе
    db.ref('users/' + name).once('value').then(function(snapshot) {
      var user = snapshot.val();
      
      if (user) {
        // Пользователь существует, проверяем пароль
        if (user.password === pass) {
          // Успешный вход
          deviceId = user.deviceId; // Берем ID аккаунта
          enterGame(name);
        } else {
          alert('Неверный пароль! Это имя уже занято.');
          btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
        }
      } else {
        // Пользователя нет, регистрируем
        db.ref('users/' + name).set({
          password: pass,
          deviceId: physicalDeviceId
        }).then(function() {
          deviceId = physicalDeviceId;
          enterGame(name);
        }).catch(function(err) {
          alert('Ошибка регистрации: ' + err.message);
          btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
        });
      }
    }).catch(function(err) {
      alert('Ошибка сети: ' + err.message);
      btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
    });
  };

  function enterGame(name) {
    currentPlayer = name;
    if (!players[name]) players[name] = { games: 0, best: 0 };
    
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('c').style.display = 'block';
    
    resetGame();
    updateHud();
    screenReady();
  }

  // 1. Главное меню (3 кнопки)
  function screenReady() {
    state = 'ready';
    currentScreen = screenReady;
    showScreen(
      'Главное меню',
      'Игрок: <b style="color:#fff">' + esc(currentPlayer) + '</b>',
      '<button class="btn primary" onclick="showGamesMenu()">🎮 Игры</button>' +
      '<button class="btn" onclick="showRatingsMenu()">🏆 Общий рейтинг</button>' +
      '<button class="btn" onclick="showOtherMenu()">⚙️ Другое</button>'
    );
  }

  // 2. Меню Игр
  window.showGamesMenu = function() {
    showScreen(
      '🎮 Игры',
      'Выбери игру:',
      '<button class="btn primary" onclick="startSnake()">🐍 Змейка</button>' +
      '<button class="btn primary" onclick="startFlappy()" style="background:linear-gradient(90deg,rgba(255,200,50,.3),rgba(255,100,50,.3));border-color:rgba(255,200,50,.5)">🐦 Flappy Bird</button>' +
      '<button class="btn primary" onclick="startTanks()" style="background:linear-gradient(90deg,rgba(50,200,100,.3),rgba(100,200,50,.3));border-color:rgba(50,200,100,.5)">🚀 Танчики</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  // 3. Меню Рейтингов
  window.showRatingsMenu = function() {
    showScreen(
      '🏆 Общий рейтинг',
      'Выбери игру для просмотра рейтинга:',
      '<button class="btn" onclick="showStats(\'snake\')">🌍 Рейтинг Змейки</button>' +
      '<button class="btn" onclick="showStats(\'flappy\')">🐦 Рейтинг Flappy</button>' +
      '<button class="btn" onclick="showStats(\'tanks\')">🚀 Рейтинг Танчиков</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  // 4. Меню Другое
  window.showOtherMenu = function() {
    showScreen(
      '⚙️ Другое',
      'Дополнительные настройки:',
      '<button class="btn" onclick="showAlley()" style="background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(255,140,0,.2));border-color:rgba(255,215,0,.5)">🏆 Аллея славы</button>' +
      '<button class="btn" onclick="showPromo()" style="background:linear-gradient(90deg,rgba(255,0,255,.2),rgba(0,255,255,.2));border-color:rgba(255,0,255,.5)">🎁 Промокоды</button>' +
      '<button class="btn danger" onclick="logout()">🚪 Выйти из аккаунта</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  // --- ВЫХОД ИЗ АККАУНТА ---
  window.logout = function() {
    if (!confirm('Выйти из аккаунта?')) return;
    
    // НЕ удаляем рейтинг! Просто выходим на экран входа.
    currentPlayer = '';
    players = {};
    deviceId = physicalDeviceId; // Сбрасываем на дефолтный ID устройства
    
    hideOverlay();
    document.getElementById('startScreen').style.display = 'flex';
    document.getElementById('c').style.display = 'none';
    
    // Очищаем поля
    document.getElementById('nameInput').value = '';
    document.getElementById('passInput').value = '';
    document.querySelector('#startScreen button').textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
  };

  // --- Аллея Славы ---
  window.showAlley = function() {
    showScreen(
      '🏆 Аллея славы',
      '<div class="alley">' +
        '<div class="alley-item dev">' +
          '<div class="alley-num">1</div>' +
          '<div>' +
            '<div class="alley-name">Владимир</div>' +
            '<div class="alley-sub">(разработчик проекта)</div>' +
          '</div>' +
        '</div>' +
        '<div class="alley-item empty">' +
          '<div class="alley-num">2</div>' +
          '<div>' +
            '<div class="alley-name">Не занято</div>' +
            '<div class="alley-sub">(чтобы занять обратитесь к разработчику)</div>' +
          '</div>' +
        '</div>' +
      '</div>',
      '<button class="btn primary" onclick="showOtherMenu()">⬅️ Назад</button>'
    );
  };

  // --- Промокоды ---
  window.showPromo = function() {
    var formHTML = 
      '<input id="promoInput" class="name-input" maxlength="20" placeholder="Введи промокод">' +
      '<button type="button" class="btn primary wide" onclick="checkPromo()" style="pointer-events:auto; cursor:pointer;">Активировать</button>' +
      '<div id="promoMsg" style="margin-top:10px; font-weight:bold;"></div>';
    showScreen('🎁 Промокоды', formHTML, '<button class="btn ghost" onclick="showOtherMenu()">⬅️ Назад</button>');
  };

  window.checkPromo = function() {
    var input = document.getElementById('promoInput');
    var code = input ? input.value.trim() : '';
    var msg = document.getElementById('promoMsg');
    
    if (code === 'Админпромокод') {
      if (!db) {
        msg.style.color = '#ff4d6d';
        msg.textContent = 'Ошибка: нет интернета (Firebase).';
        return;
      }
      
      msg.style.color = '#46e6a0';
      msg.textContent = 'Успех! Начисляем 1000 очков...';
      
      var scoreData = { name: currentPlayer, score: 1000, time: Date.now() };
      
      db.ref('scores/snake/' + deviceId).set(scoreData);
      db.ref('scores/flappy/' + deviceId).set(scoreData);
      db.ref('scores/tanks/' + deviceId).set(scoreData);
      
      setTimeout(function() {
        msg.textContent = 'Готово! 1000 очков добавлены везде.';
        beep(800, 0.2, 'sine', 0.1);
        setTimeout(function() {
          showOtherMenu();
        }, 1500);
      }, 500);
      
    } else {
      msg.style.color = '#ff4d6d';
      msg.textContent = 'Неверный промокод!';
      beep(200, 0.2, 'sawtooth', 0.05);
    }
  };

  // --- Танки ---
  window.startTanks = function() {
    state = 'tanks';
    tankScore = 0;
    tankPlayer = { x: Math.round((px/2 - 10) / 10) * 10, y: px - 60, w: 20, h: 20, speed: 120, dir: 'up', cooldown: 0 };
    tankEnemies = [];
    tankBullets = [];
    tankWalls = [];
    updateHud();
    hideOverlay();
    tankControls.classList.add('active');

    var attempts = 0;
    while (tankWalls.length < 12 && attempts < 300) {
        var ww = 40, wh = 20;
        var wx = Math.floor((40 + Math.random() * (px - 100)) / 10) * 10;
        var wy = Math.floor((40 + Math.random() * (px - 200)) / 10) * 10;
        
        var overlapsPlayer = (wx < tankPlayer.x + 50 && wx + ww + 50 > tankPlayer.x && wy < tankPlayer.y + 50 && wy + wh + 50 > tankPlayer.y);
        var overlapsWall = false;
        for (var j = 0; j < tankWalls.length; j++) {
            var ew = tankWalls[j];
            if (wx < ew.x + ew.w + 10 && wx + ww + 10 > ew.x && wy < ew.y + ew.h + 10 && wy + wh + 10 > ew.y) {
                overlapsWall = true; break;
            }
        }
        
        if (!overlapsWall && !overlapsPlayer) {
            tankWalls.push({ x: wx, y: wy, w: ww, h: wh });
        }
        attempts++;
    }
    
    spawnTankEnemy();
  };

  function canMoveTo(nx, ny, w, h) {
    if (nx < 0 || nx + w > px || ny < 0 || ny + h > px) return false;
    for (var wl of tankWalls) {
        if (nx < wl.x + wl.w && nx + w > wl.x && ny < wl.y + wl.h && ny + h > wl.y) return false;
    }
    return true;
  }

  function spawnTankEnemy() {
    var spawnPoints = [
        {x: 20, y: 20}, {x: px - 40, y: 20},
        {x: px/2 - 10, y: 20}, {x: 20, y: px/2},
        {x: px - 40, y: px/2}
    ];
    
    spawnPoints.sort(function(a, b) {
        var distA = Math.hypot(a.x - tankPlayer.x, a.y - tankPlayer.y);
        var distB = Math.hypot(b.x - tankPlayer.x, b.y - tankPlayer.y);
        return distB - distA; 
    });
    
    for (var i = 0; i < spawnPoints.length; i++) {
        var sp = spawnPoints[i];
        if (canMoveTo(sp.x, sp.y, 20, 20)) {
            tankEnemies.push({ 
                x: Math.round(sp.x/10)*10, 
                y: Math.round(sp.y/10)*10, 
                w: 20, h: 20, speed: 60, dir: 'down', cooldown: 1.5,
                nextTurn: 0 
            });
            return;
        }
    }
    tankEnemies.push({ x: 20, y: 20, w: 20, h: 20, speed: 60, dir: 'down', cooldown: 1.5, nextTurn: 0 });
  }

  window.tankInput = function(dir, isDown) {
    tankKeys[dir] = isDown;
  };
  
  window.tankFire = function() {
    if (state !== 'tanks' || tankPlayer.cooldown > 0) return;
    tankPlayer.cooldown = 0.4;
    
    var cx = tankPlayer.x + tankPlayer.w/2;
    var cy = tankPlayer.y + tankPlayer.h/2;
    var vx = 0, vy = 0;
    
    if (tankPlayer.dir === 'up') vy = -350;
    if (tankPlayer.dir === 'down') vy = 350;
    if (tankPlayer.dir === 'left') vx = -350;
    if (tankPlayer.dir === 'right') vx = 350;

    var offset = 6;
    if (tankPlayer.dir === 'up' || tankPlayer.dir === 'down') {
        tankBullets.push({ x: cx - offset, y: cy, vx: vx, vy: vy, friendly: true });
        tankBullets.push({ x: cx + offset, y: cy, vx: vx, vy: vy, friendly: true });
    } else {
        tankBullets.push({ x: cx, y: cy - offset, vx: vx, vy: vy, friendly: true });
        tankBullets.push({ x: cx, y: cy + offset, vx: vx, vy: vy, friendly: true });
    }
    
    beep(600, 0.05, 'square', 0.05);
  };

  function updateTanks(dt) {
    if (state !== 'tanks') return;

    var p = tankPlayer;
    p.cooldown -= dt/1000;
    
    var moveDir = null;
    if (tankKeys.up) moveDir = 'up';
    else if (tankKeys.down) moveDir = 'down';
    else if (tankKeys.left) moveDir = 'left';
    else if (tankKeys.right) moveDir = 'right';

    if (moveDir) {
        p.dir = moveDir;
        var moveSpeed = p.speed * (dt/1000);
        
        if (moveDir === 'up' || moveDir === 'down') {
            p.x = Math.round(p.x / 10) * 10;
            var ny = p.y + (moveDir === 'up' ? -moveSpeed : moveSpeed);
            if (canMoveTo(p.x, ny, p.w, p.h)) p.y = ny;
        } else {
            p.y = Math.round(p.y / 10) * 10;
            var nx = p.x + (moveDir === 'left' ? -moveSpeed : moveSpeed);
            if (canMoveTo(nx, p.y, p.w, p.h)) p.x = nx;
        }
    }

    if (tankEnemies.length === 0) {
        spawnTankEnemy();
    }
    
    for (var i = tankEnemies.length - 1; i >= 0; i--) {
        var e = tankEnemies[i];
        e.cooldown -= dt/1000;
        e.nextTurn -= dt/1000;

        var dx = p.x - e.x;
        var dy = p.y - e.y;
        var eSpeed = e.speed * (dt/1000);

        var needNewDir = false;
        var testX = e.x, testY = e.y;
        if (e.dir === 'up') testY -= eSpeed;
        if (e.dir === 'down') testY += eSpeed;
        if (e.dir === 'left') testX -= eSpeed;
        if (e.dir === 'right') testX += eSpeed;

        if (!canMoveTo(testX, testY, e.w, e.h)) needNewDir = true;
        if (e.nextTurn <= 0) needNewDir = true;

        if (needNewDir) {
            var prefX = dx > 0 ? 'right' : 'left';
            var prefY = dy > 0 ? 'down' : 'up';
            var primaryDir = Math.abs(dx) > Math.abs(dy) ? prefX : prefY;
            var secondaryDir = Math.abs(dx) > Math.abs(dy) ? prefY : prefX;

            var dirsToTry = [primaryDir, secondaryDir, prefX === 'right' ? 'left' : 'right', prefY === 'down' ? 'up' : 'down'];
            
            if (e.dir === 'up' || e.dir === 'down') e.x = Math.round(e.x / 10) * 10;
            else e.y = Math.round(e.y / 10) * 10;

            for (var d of dirsToTry) {
                var tx = e.x, ty = e.y;
                if (d === 'up') ty -= 15;
                if (d === 'down') ty += 15;
                if (d === 'left') tx -= 15;
                if (d === 'right') tx += 15;

                if (canMoveTo(tx, ty, e.w, e.h)) {
                    e.dir = d;
                    e.nextTurn = 1.0 + Math.random() * 1.5;
                    break;
                }
            }
        }

        if (e.dir === 'up' && canMoveTo(e.x, e.y - eSpeed, e.w, e.h)) e.y -= eSpeed;
        else if (e.dir === 'down' && canMoveTo(e.x, e.y + eSpeed, e.w, e.h)) e.y += eSpeed;
        else if (e.dir === 'left' && canMoveTo(e.x - eSpeed, e.y, e.w, e.h)) e.x -= eSpeed;
        else if (e.dir === 'right' && canMoveTo(e.x + eSpeed, e.y, e.w, e.h)) e.x += eSpeed;

        if (e.cooldown <= 0) {
            e.cooldown = 2.5;
            var vx = 0, vy = 0;
            if (e.dir === 'up') vy = -200; if (e.dir === 'down') vy = 200;
            if (e.dir === 'left') vx = -200; if (e.dir === 'right') vx = 200;
            tankBullets.push({ x: e.x + 10, y: e.y + 10, vx: vx, vy: vy, friendly: false });
        }

        if (e.x < p.x + p.w && e.x + e.w > p.x && e.y < p.y + p.h && e.y + e.h > p.y) {
            return dieTanks();
        }
    }

    for (var i = tankBullets.length - 1; i >= 0; i--) {
        var b = tankBullets[i];
        b.x += b.vx * (dt/1000);
        b.y += b.vy * (dt/1000);

        if (b.x < 0 || b.x > px || b.y < 0 || b.y > px) { tankBullets.splice(i, 1); continue; }

        var hitW = false;
        for (var j = tankWalls.length - 1; j >= 0; j--) {
            var w = tankWalls[j];
            if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                tankWalls.splice(j, 1); hitW = true; beep(200, 0.1, 'sawtooth', 0.02); break;
            }
        }
        if (hitW) { tankBullets.splice(i, 1); continue; }

        if (b.friendly) {
            for (var j = tankEnemies.length - 1; j >= 0; j--) {
                var e = tankEnemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    tankEnemies.splice(j, 1);
                    tankBullets.splice(i, 1);
                    tankScore++;
                    updateHud();
                    beep(400, 0.1, 'square', 0.05);
                    break;
                }
            }
        } else {
            if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
                return dieTanks();
            }
        }
    }
  }

  function dieTanks() {
    state = 'over';
    beep(150, 0.4, 'sawtooth', 0.07);
    sendScoreToServer('tanks', tankScore);
    showScreen('Танчики: Игра окончена', 'Ты уничтожил <b>' + tankScore + '</b> врагов', '<button class="btn primary" onclick="startTanks()">Ещё раз</button><button class="btn" onclick="showGamesMenu()">В меню игр</button>');
  }

  function drawTanks() {
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, px, px); 
    
    ctx.fillStyle = '#8b4513'; 
    for(var w of tankWalls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#5c2d0c'; ctx.lineWidth = 2; ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    for(var e of tankEnemies) {
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#aa0000'; 
        if(e.dir === 'up') { ctx.fillRect(e.x+6, e.y-6, 8, 10); }
        else if(e.dir === 'down') { ctx.fillRect(e.x+6, e.y+e.h-4, 8, 10); }
        else if(e.dir === 'left') { ctx.fillRect(e.x-6, e.y+6, 10, 8); }
        else if(e.dir === 'right') { ctx.fillRect(e.x+e.w-4, e.y+6, 10, 8); }
    }

    var p = tankPlayer;
    ctx.fillStyle = '#46e6a0';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#298f62';
    if(p.dir === 'up') { ctx.fillRect(p.x+6, p.y-6, 8, 10); }
    else if(p.dir === 'down') { ctx.fillRect(p.x+6, p.y+p.h-4, 8, 10); }
    else if(p.dir === 'left') { ctx.fillRect(p.x-6, p.y+6, 10, 8); }
    else if(p.dir === 'right') { ctx.fillRect(p.x+p.w-4, p.y+6, 10, 8); }

    for(var b of tankBullets) {
        ctx.fillStyle = b.friendly ? '#fff' : '#ff9900';
        ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  // --- Рейтинги (Firebase) ---
  window.showStats = function(gameType) {
    if (!db) {
      showScreen('Ошибка', 'Нет интернета или Firebase заблокирован.', '<button class="btn primary" onclick="showRatingsMenu()">⬅️ Назад</button>');
      return;
    }
    var url = 'https://vova-snake-420c6-default-rtdb.firebaseio.com/scores/' + gameType + '.json';
    var gameName = gameType === 'snake' ? 'Змейка' : (gameType === 'flappy' ? 'Flappy' : 'Танчики');
    showScreen('Рейтинг: ' + gameName, '<div style="color:#8ea6c9;padding:16px">Загрузка...</div>', '<button class="btn primary" onclick="showRatingsMenu()">⬅️ Назад</button>');

    fetch(url).then(res => res.json()).then(data => {
        var bestByName = {};
        if (data) {
          for (var key in data) {
            var entry = data[key];
            if (entry && entry.name) {
              var lowerName = entry.name.toLowerCase();
              if (!bestByName[lowerName] || entry.score > bestByName[lowerName].score) {
                bestByName[lowerName] = entry;
              }
            }
          }
        }
        var list = Object.keys(bestByName).map(function(k){ return bestByName[k]; });
        list.sort(function(a, b) { return b.score - a.score; });
        
        var body = '';
        if (list.length === 0) body = '<div style="color:#8ea6c9;padding:16px">Пока пусто</div>';
        else {
          var rows = list.map(function(p, i) {
            return '<tr><td class="num" style="color:#8ea6c9">' + (i + 1) + '</td>' +
              '<td>' + esc(p.name) + (p.name.toLowerCase() === currentPlayer.toLowerCase() ? ' (ты)' : '') + '</td>' +
              '<td class="num" style="color:#46e6a0;font-weight:700;">' + p.score + '</td>' +
              '<td class="num" style="color:#8ea6c9;font-size:11px">' + fmtDate(p.time) + '</td></tr>';
          }).join('');
          body = '<table class="stats"><thead><tr><th>#</th><th>Игрок</th><th style="text-align:right">Рекорд</th><th style="text-align:right">Когда</th></tr></thead><tbody>' + rows + '</tbody></table>';
        }
        showScreen('Рейтинг: ' + gameName, body, '<button class="btn primary" onclick="showRatingsMenu()">⬅️ Назад</button>');
      }).catch(err => {
        showScreen('Ошибка', 'Не удалось загрузить рейтинг.', '<button class="btn primary" onclick="showRatingsMenu()">⬅️ Назад</button>');
      });
  };

  function sendScoreToServer(gameType, finalScore) {
    if (!finalScore || !db) return;
    var url = 'https://vova-snake-420c6-default-rtdb.firebaseio.com/scores/' + gameType + '/' + deviceId + '.json';
    fetch(url).then(res => res.json()).then(ex => {
       if (!ex || finalScore > ex.score) {
           fetch(url, {
               method: 'PUT',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ name: currentPlayer, score: finalScore, time: Date.now() })
           });
       }
    }).catch(e => {});
  }

  // --- Змейка и Flappy ---
  function resetGame() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1, y:0}; queue = []; particles = []; score = 0; stepMs = 150; acc = 0; spawnFood();
  }

  window.startSnake = function() {
    resetGame(); state = 'play'; hideOverlay(); acc = 0; updateHud();
  };

  function spawnFood() {
    // Спавним яблочко в центральной зоне
    var free = [];
    for (var y = 4; y < 16; y++) {
      for (var x = 4; x < 16; x++) {
        if (!snake.some(function(s){ return s.x === x && s.y === y; })) free.push({x:x, y:y});
      }
    }
    // Если центр занят, спавним везде
    if (free.length === 0) {
      for (var y = 0; y < GRID; y++)
        for (var x = 0; x < GRID; x++)
          if (!snake.some(function(s){ return s.x === x && s.y === y; })) free.push({x:x, y:y});
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : {x:0, y:0};
  }

  function setDir(d) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -d.x && last.y === -d.y) return;
    if (last.x === d.x && last.y === d.y) return;
    if (queue.length < 2) queue.push(d);
  }

  function stepSnake() {
    if (state !== 'play') return;
    if (queue.length) dir = queue.shift();
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return dieSnake();
    var grow = (head.x === food.x && head.y === food.y);
    var body = grow ? snake : snake.slice(0, -1);
    if (body.some(function(s){ return s.x === head.x && s.y === head.y; })) return dieSnake();
    snake.unshift(head);
    if (grow) {
      score++; scoreEl.textContent = score;
      stepMs = Math.max(62, 150 - score * 4);
      burst((food.x + 0.5) * cell, (food.y + 0.5) * cell, '#ff4d6d', 16);
      spawnFood(); beep(680, 0.09, 'triangle', 0.05);
    } else snake.pop();
  }

  function dieSnake() {
    if (state !== 'play') return;
    state = 'over';
    var h = snake[0];
    burst((h.x + 0.5) * cell, (h.y + 0.5) * cell, '#ff4d6d', 26);
    beep(150, 0.45, 'sawtooth', 0.07);
    sendScoreToServer('snake', score);
    showScreen('Змейка: Игра окончена', 'Счёт: <b>' + score + '</b>', '<button class="btn primary" onclick="startSnake()">Ещё раз</button><button class="btn" onclick="showGamesMenu()">В меню игр</button>');
  }

  window.startFlappy = function() {
    state = 'flappy'; flappyState = 'ready'; flappyBird.y = px / 2 - 20; flappyBird.vy = 0;
    flappyPipes = []; flappyScore = 0; hideOverlay();
    showScreen('Flappy Bird', 'Нажимай, чтобы лететь', '<button class="btn primary" onclick="flappyPlay()">Погнали!</button>');
  };

  window.flappyPlay = function() { flappyState = 'playing'; hideOverlay(); };

  function updateFlappy(dt) {
    if (state !== 'flappy' || flappyState !== 'playing') return;
    flappyBird.vy += flappyBird.gravity * (dt / 16);
    flappyBird.y += flappyBird.vy * (dt / 16);
    if (flappyBird.y < 0) { flappyBird.y = 0; flappyBird.vy = 0; }
    if (flappyBird.y + flappyBird.size > px) return dieFlappy();
    
    if (flappyPipes.length === 0 || flappyPipes[flappyPipes.length - 1].x < px - px * 0.6) {
      var gap = px * 0.35;
      var topH = px * 0.1 + Math.random() * (px - gap - px * 0.25);
      flappyPipes.push({ x: px, topH: topH, passed: false });
    }
    for (var i = flappyPipes.length - 1; i >= 0; i--) {
      var p = flappyPipes[i];
      p.x -= flappySpeed * (dt / 16);
      if (!p.passed && p.x + px * 0.15 < flappyBird.x) { p.passed = true; flappyScore++; beep(800, 0.05, 'sine', 0.05); }
      if (p.x + px * 0.15 < 0) { flappyPipes.splice(i, 1); continue; }
      if (flappyBird.x + flappyBird.size > p.x && flappyBird.x < p.x + px * 0.15) {
        if (flappyBird.y < p.topH || flappyBird.y + flappyBird.size > p.topH + px * 0.35) return dieFlappy();
      }
    }
  }

  function dieFlappy() {
    flappyState = 'over'; beep(150, 0.4, 'sawtooth', 0.07);
    sendScoreToServer('flappy', flappyScore);
    showScreen('Flappy: Игра окончена', 'Счёт: <b>' + flappyScore + '</b>', '<button class="btn primary" onclick="startFlappy()">Ещё раз</button><button class="btn" onclick="showGamesMenu()">В меню игр</button>');
  }

  // --- Рендеринг ---
  function burst(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2, sp = (0.03 + Math.random() * 0.13) * (cell / 20);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * 0.06, life: 500, max: 700, color: color });
    }
  }

  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    if(!ctx) return;
    
    if (state === 'tanks') {
        drawTanks();
        return;
    }

    ctx.fillStyle = '#0c1224'; ctx.fillRect(0, 0, px, px);

    if (state === 'flappy') {
      ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, px, px);
      var pWidth = px * 0.15; ctx.fillStyle = '#73bf2e'; ctx.strokeStyle = '#558c22'; ctx.lineWidth = 3;
      for (var i = 0; i < flappyPipes.length; i++) {
        var p = flappyPipes[i];
        ctx.fillRect(p.x, 0, pWidth, p.topH); ctx.strokeRect(p.x, 0, pWidth, p.topH);
        var botH = px - (p.topH + px * 0.35); ctx.fillRect(p.x, px - botH, pWidth, botH); ctx.strokeRect(p.x, px - botH, pWidth, botH);
      }
      ctx.fillStyle = '#fadd44'; ctx.beginPath(); ctx.arc(flappyBird.x + 10, flappyBird.y + 10, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (px * 0.1) + 'px Arial'; ctx.textAlign = 'center'; ctx.fillText(flappyScore, px / 2, px * 0.1);
      return;
    }

    if (state === 'play' || state === 'over' || state === 'pause') {
      if (!snake) return;
      for (var i = snake.length - 1; i >= 0; i--) {
        var s = snake[i]; var p = snake.length === 1 ? 0 : i / (snake.length - 1);
        var hue = 152 + p * 48; var light = 62 - p * 16; var pad = cell * 0.09;
        ctx.fillStyle = 'hsl(' + hue + ',85%,' + light + '%)';
        if (i === 0) { ctx.shadowColor = 'rgba(70,230,170,.9)'; ctx.shadowBlur = cell * 0.9; }
        else ctx.shadowBlur = 0;
        rrect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.3);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      var h = snake[0];
      var hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
      var fx = dir.x * cell * 0.16, fy = dir.y * cell * 0.16;
      var sx = -dir.y * cell * 0.18, sy = dir.x * cell * 0.18;
      ctx.fillStyle = '#06281f';
      for (var sgn = 1; sgn >= -1; sgn -= 2) {
        ctx.beginPath(); ctx.arc(hx + fx + sx * sgn, hy + fy + sy * sgn, cell * 0.09, 0, Math.PI * 2); ctx.fill();
      }

      var t = performance.now() / 1000; var k = 1 + Math.sin(t * 5) * 0.09;
      var cx = (food.x + 0.5) * cell, cy = (food.y + 0.5) * cell;
      ctx.save(); ctx.shadowColor = 'rgba(255,77,109,.95)'; ctx.shadowBlur = cell * 0.9;
      var g = ctx.createRadialGradient(cx - cell * 0.1, cy - cell * 0.1, cell * 0.04, cx, cy, cell * 0.42);
      g.addColorStop(0, '#ff9ab0'); g.addColorStop(1, '#ff3d63');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, cell * 0.33 * k, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }

  function resize() {
    if(!canvas) return;
    var w = Math.min(window.innerWidth - 32, 560);
    var h = window.innerHeight - 130;
    px = Math.max(200, Math.floor(Math.min(w, h)));
    cell = px / GRID;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(px * dpr); canvas.height = Math.round(px * dpr);
    canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    var dt = Math.min(100, t - lastTime); lastTime = t;
    
    if (state === 'play') {
      acc += dt; var guard = 0;
      while (state === 'play' && acc >= stepMs && guard++ < 5) { acc -= stepMs; stepSnake(); }
    } else if (state === 'flappy') {
      updateFlappy(dt);
    } else if (state === 'tanks') {
      updateTanks(dt);
    }
    
    draw();
    requestAnimationFrame(loop);
  }

  // --- Инициализация ---
  window.onload = function() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d');
    overlay = document.getElementById('overlay');
    ovTitle = document.getElementById('ov-title');
    ovText = document.getElementById('ov-text');
    ovActions = document.getElementById('ov-actions');
    scoreEl = document.getElementById('score');
    bestEl = document.getElementById('best');
    hudPlayer = document.getElementById('hudPlayer');
    tankControls = document.getElementById('tank-controls');

    resetGame(); updateHud(); resize();

    // Свайпы (Змейка)
    var touchStart = null;
    canvas.addEventListener('touchstart', function(e) {
      if (state === 'flappy' && flappyState === 'playing') {
        e.preventDefault(); flappyBird.vy = flappyBird.jump; beep(400, 0.05); return;
      }
      if (state === 'play') {
        var t = e.changedTouches[0];
        touchStart = {x: t.clientX, y: t.clientY};
      }
    }, {passive: false});

    canvas.addEventListener('touchmove', function(e) { 
      if (state !== 'play' || !touchStart) return;
      e.preventDefault(); 
      
      var t = e.changedTouches[0];
      var dx = t.clientX - touchStart.x;
      var dy = t.clientY - touchStart.y;
      
      if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
        if (Math.abs(dx) > Math.abs(dy)) setDir({x: Math.sign(dx), y: 0});
        else setDir({x: 0, y: Math.sign(dy)});
        
        touchStart = {x: t.clientX, y: t.clientY}; 
      }
    }, {passive: false});

    canvas.addEventListener('touchend', function(e) {
      touchStart = null;
    }, {passive: false});

    canvas.addEventListener('mousedown', function() {
      if (state === 'flappy' && flappyState === 'playing') { flappyBird.vy = flappyBird.jump; beep(400, 0.05); }
    });

    // Клавиатура
    window.addEventListener('keydown', function(e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      
      if (state === 'tanks') {
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ц') { tankKeys.up = true; e.preventDefault(); }
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'ы') { tankKeys.down = true; e.preventDefault(); }
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') { tankKeys.left = true; e.preventDefault(); }
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') { tankKeys.right = true; e.preventDefault(); }
          if (e.key === ' ' || e.key === 'Enter') { tankFire(); e.preventDefault(); }
          return;
      }

      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
        e.preventDefault();
        if (state === 'flappy' && flappyState === 'playing') { flappyBird.vy = flappyBird.jump; beep(400, 0.05); }
      }
      if (state === 'play') {
        var map = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}, w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}};
        var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (map[k]) { e.preventDefault(); setDir(map[k]); }
      }
    });

    window.addEventListener('keyup', function(e) {
        if (state === 'tanks') {
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ц') { tankKeys.up = false; }
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'ы') { tankKeys.down = false; }
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') { tankKeys.left = false; }
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') { tankKeys.right = false; }
        }
    });

    window.addEventListener('resize', resize);
    
    if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }

    // Фоновая загрузка Firebase
    var script1 = document.createElement('script');
    script1.src = "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js";
    script1.onload = function() {
      var script2 = document.createElement('script');
      script2.src = "https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js";
      script2.onload = function() {
        try {
          firebase.initializeApp({ databaseURL: "https://vova-snake-420c6-default-rtdb.firebaseio.com" });
          db = firebase.database();
        } catch(e) { console.log("Firebase error:", e); }
      };
      document.body.appendChild(script2);
    };
    document.body.appendChild(script1);
  };
</script>
