<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Игры — Вова (версия 70)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d}
  body{
    background:radial-gradient(circle at 50% -10%,#16223f 0%,#080b14 55%,#05070d 100%);
    color:#e8f1ff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #bg{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  #bg span{
    font-size:clamp(36px,12vw,150px);font-weight:900;line-height:.92;text-align:center;
    text-transform:uppercase;letter-spacing:.02em;transform:rotate(-12deg);
    color:rgba(255,255,255,.16);text-shadow:0 0 90px rgba(255,255,255,.14);
  }
  
  #startScreen {
    position: fixed; inset: 0; z-index: 9999; background: #05070d;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }

  #wrap{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:16px;align-items:center;max-width:100vw}
  #hud{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;
       font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8ea6c9}
  #hud b{color:#fff;font-weight:700;font-size:15px;letter-spacing:0}
  #hudPlayer{color:#46e6a0;font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%}
  #stage{position:relative;line-height:0}
  canvas{display:block;border-radius:18px;touch-action:none;
    box-shadow:0 0 0 1px rgba(120,180,255,.16),0 24px 70px -24px rgba(40,140,255,.75)}
  
  #overlay{
    position:absolute;inset:0;display:none; 
    flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:20px;text-align:center;border-radius:18px;
    background:rgba(6,10,20,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;transition:opacity .2s ease;z-index:10;
  }
  #overlay.show{opacity:1;pointer-events:auto; display:flex;}
  
  #ov-title{margin:0;font-size:clamp(20px,5.6vw,28px);
    color:#46e6a0; text-shadow:0 0 15px rgba(70,230,160,.4); font-weight:800;}
    
  #ov-text{margin:0;font-size:14px;line-height:1.55;color:#a9bfdd;max-height:44vh;overflow:auto;width:100%}
  #ov-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;margin-top:4px}
  .btn{
    appearance:none;border:1px solid rgba(120,180,255,.35);
    background:rgba(70,140,255,.14);color:#e8f1ff;
    padding:10px 18px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s,border-color .15s,transform .08s;
    pointer-events: auto; width: 100%; max-width: 280px;
    touch-action: manipulation;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,rgba(70,230,160,.3),rgba(58,168,255,.3));border-color:rgba(70,230,160,.5)}
  .btn.ghost{background:transparent;color:#8ea6c9;border-color:rgba(120,180,255,.2)}
  .btn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.45);color:#ffb3c1}
  .btn.wide{width:100%;max-width:260px;padding:15px;font-size:16px;}
  .name-input{
    width:100%;max-width:260px;padding:12px 14px;border-radius:12px;
    border:1px solid rgba(120,180,255,.35);background:rgba(10,16,30,.85);
    color:#fff;font:inherit;font-size:16px;text-align:center;outline:none;
    margin-bottom: 10px; touch-action: manipulation;
  }
  .name-input:focus{border-color:rgba(70,230,160,.7);box-shadow:0 0 0 3px rgba(70,230,160,.15)}
  
  .stats{width:100%;border-collapse:collapse;font-size:13px}
  .stats th,.stats td{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(120,180,255,.1)}
  .stats th{color:#8ea6c9;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
            position:sticky;top:0;background:rgba(6,10,20,.95)}
  .stats td{color:#e8f1ff}
  .stats tbody tr:first-child td{color:#46e6a0;font-weight:700}
  .stats td.num{text-align:right;font-variant-numeric:tabular-nums}

  .alley{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;padding:4px 2px}
  .alley-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:14px;
    border:1px solid rgba(120,180,255,.2);
    background:rgba(10,16,30,.6);
  }
  .alley-num{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;
    background:rgba(70,140,255,.16);color:#8ea6c9;
  }
  .alley-name{font-size:15px;font-weight:700;color:#fff;line-height:1.25}
  .alley-sub{font-size:12px;color:#8ea6c9;margin-top:2px}
  .alley-item.dev{border-color:rgba(70,230,160,.45);background:rgba(70,230,160,.08)}
  .alley-item.dev .alley-num{background:linear-gradient(135deg,#46e6a0,#3aa8ff);color:#06281f}
  .alley-item.empty{opacity:.85}

  #tank-controls { position:absolute; inset:0; pointer-events:none; display:none; z-index:5; }
  #tank-controls.active { display:block; }
  .d-pad {
    position:absolute; bottom:20px; left:20px;
    display:grid; grid-template-columns:repeat(3, 50px); grid-template-rows:repeat(3, 50px);
    gap:5px; pointer-events:auto;
  }
  .d-pad button {
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4);
    border-radius:10px; color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:none;
  }
  .d-pad button:active { background:rgba(255,255,255,0.5); }
  .d-pad .up { grid-column:2; grid-row:1; }
  .d-pad .left { grid-column:1; grid-row:2; }
  .d-pad .right { grid-column:3; grid-row:2; }
  .d-pad .down { grid-column:2; grid-row:3; }
  
  #fire-btn {
    position:absolute; bottom:40px; right:30px; width:80px; height:80px;
    border-radius:50%; background:rgba(255,77,109,0.3); border:2px solid rgba(255,77,109,0.6);
    color:#fff; font-size:16px; font-weight:bold; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    user-select:none; touch-action:none;
  }
  #fire-btn:active { background:rgba(255,77,109,0.7); }
</style>
</head>
<body>

<div id="startScreen">
  <h1 style="color:#46e6a0; font-size:28px; margin-bottom:10px; text-align:center;">Вход в игру</h1>
  <p style="color:#8ea6c9; font-size:12px; margin-bottom:20px; text-align:center;">Если имени нет — создастся новый аккаунт.<br>Если имя занято — введи свой пароль.</p>
  
  <input id="nameInput" class="name-input" maxlength="16" placeholder="Твоё имя" autocomplete="off">
  <input id="passInput" type="password" class="name-input" maxlength="20" placeholder="Пароль" autocomplete="off">
  
  <div id="loginStatus" style="color:#ffd166; font-size:14px; font-weight:bold; min-height:20px; margin-bottom:10px; text-align:center;"></div>

  <button type="button" id="loginBtn" class="btn ghost wide" onclick="startGame()" style="background:rgba(70,140,255,.2);">ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ</button>
</div>

<div id="bg"><span>Вова<br>разработчик<br>этой игры</span></div>

<div id="wrap">
  <div id="hud">
    <span id="hudPlayer">—</span>
    <span>Счёт <b id="score">0</b></span>
    <span>Рекорд <b id="best">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c" style="display:none;"></canvas>
    
    <div id="tank-controls">
      <div class="d-pad">
        <button class="up" onpointerdown="event.preventDefault(); tankInput('up', true)" onpointerup="tankInput('up', false)" onpointerleave="tankInput('up', false)">▲</button>
        <button class="left" onpointerdown="event.preventDefault(); tankInput('left', true)" onpointerup="tankInput('left', false)" onpointerleave="tankInput('left', false)">◀</button>
        <button class="right" onpointerdown="event.preventDefault(); tankInput('right', true)" onpointerup="tankInput('right', false)" onpointerleave="tankInput('right', false)">▶</button>
        <button class="down" onpointerdown="event.preventDefault(); tankInput('down', true)" onpointerup="tankInput('down', false)" onpointerleave="tankInput('down', false)">▼</button>
      </div>
      <button id="fire-btn" onpointerdown="event.preventDefault(); tankFire()">ОГОНЬ</button>
    </div>

    <div id="overlay">
      <h1 id="ov-title">Игра</h1>
      <div id="ov-text"></div>
      <div id="ov-actions"></div>
    </div>
  </div>
</div>

<script>
  var store = {
    get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
    remove: function(k) { try { localStorage.removeItem(k); } catch(e) {} }
  };

  var db = null; 
  var canvas = document.getElementById('c'); 
  var ctx = canvas ? canvas.getContext('2d') : null;
  var overlay = document.getElementById('overlay'); 
  var ovTitle = document.getElementById('ov-title'); 
  var ovText = document.getElementById('ov-text'); 
  var ovActions = document.getElementById('ov-actions');
  var scoreEl = document.getElementById('score'); 
  var bestEl = document.getElementById('best'); 
  var hudPlayer = document.getElementById('hudPlayer');
  var tankControls = document.getElementById('tank-controls');

  var currentPlayer = '';
  var players = {}; 
  var state = 'name';
  var currentScreen = null;

  var physicalDeviceId = store.get('snake.physicalDeviceId') || 'dev_' + Math.random().toString(36).substring(2, 10);
  store.set('snake.physicalDeviceId', physicalDeviceId);
  var deviceId = physicalDeviceId;

  var px = 400, cell = 20, GRID = 20;
  var particles = [];
  var loopStarted = false;
  var lastTime = 0;

  // Игры
  var snake, dir, queue, food, score, acc, stepMs;
  var flappyBird = { x: 50, y: 150, vy: 0, gravity: 0.25, jump: -4.5, size: 20 };
  var flappyPipes = [], flappyScore = 0, flappyState = 'ready', flappySpeed = 2;
  var tankPlayer = { x: 200, y: 200, w: 20, h: 20, speed: 120, dir: 'up', cooldown: 0 };
  var tankEnemies = [], tankBullets = [], tankWalls = [], tankScore = 0;
  var tankKeys = { up: false, down: false, left: false, right: false };

  // Морской бой
  var bsRoom = '';
  var bsMyGrid = [], bsEnemyGrid = [];
  var bsState = 'menu'; 
  var bsRoomRef = null;
  var bsIsMyTurn = false;
  var bsView = 'enemy';
  var bsMyShips = [], bsMyHits = 0, bsEnemyHits = 0;
  var bsTotalShipCells = 20;
  var bsPollTimer = null;
  var bsGameOverShown = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(ts) { var d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}); }

  var actx = null;
  function beep(freq, dur, type, vol) {
    type = type || 'sine'; vol = vol || 0.05;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function showScreen(title, textHTML, actionsHTML) {
    try {
      if (!ovTitle) return;
      ovTitle.textContent = title;
      ovText.innerHTML = textHTML;
      ovActions.innerHTML = actionsHTML;
      overlay.style.display = 'flex';
      overlay.classList.add('show');
      if(tankControls) tankControls.classList.remove('active');
    } catch(e) { console.log(e); }
  }
  
  function hideOverlay() { 
    try {
      overlay.classList.remove('show'); 
      overlay.style.display = 'none';
    } catch(e) {}
  }

  function updateHud() {
    try {
      hudPlayer.textContent = currentPlayer || '—';
      var p = players[currentPlayer];
      bestEl.textContent = p ? p.best : 0;
      scoreEl.textContent = state === 'tanks' ? tankScore : (state === 'bs' ? bsEnemyHits : (score || 0));
    } catch(e) {}
  }

  // --- БЕЗОПАСНЫЙ ВХОД ---
  window.startGame = function() {
    var inputName = document.getElementById('nameInput');
    var inputPass = document.getElementById('passInput');
    var statusDiv = document.getElementById('loginStatus');
    var btn = document.getElementById('loginBtn');
    
    var name = inputName ? inputName.value.trim().replace(/\s+/g, ' ').slice(0, 16) : '';
    var pass = inputPass ? inputPass.value.trim().slice(0, 20) : '';
    
    if (!name || !pass) {
      statusDiv.style.color = '#ff4d6d';
      statusDiv.textContent = 'Введи имя и пароль!';
      return;
    }

    statusDiv.style.color = '#ffd166';
    statusDiv.textContent = 'Подключение...';
    if (btn) btn.textContent = 'ЗАГРУЗКА...';

    if (!db) {
      statusDiv.textContent = 'Нет сети. Вход без рейтинга...';
      setTimeout(function() { enterGame(name); }, 1000);
      return;
    }

    var timeoutId = setTimeout(function() {
      statusDiv.textContent = 'Сервер не отвечает. Вход без рейтинга...';
      setTimeout(function() { enterGame(name); }, 1000);
    }, 4000);

    try {
      db.ref('users/' + name).once('value').then(function(snapshot) {
        clearTimeout(timeoutId);
        var user = snapshot.val();
        
        if (user) {
          if (user.password === pass) {
            deviceId = user.deviceId;
            enterGame(name);
          } else {
            statusDiv.style.color = '#ff4d6d';
            statusDiv.textContent = 'Неверный пароль!';
            if (btn) btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
          }
        } else {
          db.ref('users/' + name).set({
            password: pass,
            deviceId: physicalDeviceId
          }).then(function() {
            deviceId = physicalDeviceId;
            enterGame(name);
          }).catch(function(err) {
            clearTimeout(timeoutId);
            statusDiv.style.color = '#ff4d6d';
            statusDiv.textContent = 'Ошибка записи: ' + err.message;
            if (btn) btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
          });
        }
      }).catch(function(err) {
        clearTimeout(timeoutId);
        statusDiv.style.color = '#ff4d6d';
        statusDiv.textContent = 'Ошибка сети: ' + err.message;
        if (btn) btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
      });
    } catch (e) {
      clearTimeout(timeoutId);
      statusDiv.style.color = '#ff4d6d';
      statusDiv.textContent = 'Ошибка: ' + e.message;
      if (btn) btn.textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
    }
  };

  function enterGame(name) {
    try {
      currentPlayer = name;
      if (!players[name]) players[name] = { games: 0, best: 0 };
      
      document.getElementById('startScreen').style.display = 'none';
      if (canvas) canvas.style.display = 'block';
      
      resetGame();
      updateHud();
      screenReady();
    } catch(e) {
      document.getElementById('startScreen').style.display = 'flex';
      document.getElementById('loginStatus').textContent = 'Ошибка запуска: ' + e.message;
    }
  }

  function screenReady() {
    state = 'ready';
    currentScreen = screenReady;
    showScreen(
      'Главное меню',
      'Игрок: <b style="color:#fff">' + esc(currentPlayer) + '</b>',
      '<button class="btn primary" onclick="showGamesMenu()">🎮 Игры</button>' +
      '<button class="btn" onclick="showRatingsMenu()">🏆 Общий рейтинг</button>' +
      '<button class="btn" onclick="showOtherMenu()">⚙️ Другое</button>'
    );
  }

  window.showGamesMenu = function() {
    showScreen('🎮 Игры', 'Выбери игру:',
      '<button class="btn primary" onclick="startSnake()">🐍 Змейка</button>' +
      '<button class="btn primary" onclick="startFlappy()" style="background:linear-gradient(90deg,rgba(255,200,50,.3),rgba(255,100,50,.3));border-color:rgba(255,200,50,.5)">🐦 Flappy Bird</button>' +
      '<button class="btn primary" onclick="startTanks()" style="background:linear-gradient(90deg,rgba(50,200,100,.3),rgba(100,200,50,.3));border-color:rgba(50,200,100,.5)">🚀 Танчики</button>' +
      '<button class="btn primary" onclick="startBSMenu()" style="background:linear-gradient(90deg,rgba(50,100,200,.3),rgba(0,200,255,.3));border-color:rgba(0,200,255,.5)">🚢 Морской бой</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  window.showRatingsMenu = function() {
    showScreen('🏆 Общий рейтинг', 'Выбери игру:',
      '<button class="btn" onclick="showStats(\'snake\')">🌍 Рейтинг Змейки</button>' +
      '<button class="btn" onclick="showStats(\'flappy\')">🐦 Рейтинг Flappy</button>' +
      '<button class="btn" onclick="showStats(\'tanks\')">🚀 Рейтинг Танчиков</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  window.showOtherMenu = function() {
    showScreen('⚙️ Другое', 'Дополнительные настройки:',
      '<button class="btn" onclick="showAlley()" style="background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(255,140,0,.2));border-color:rgba(255,215,0,.5)">🏆 Аллея славы</button>' +
      '<button class="btn" onclick="showPromo()" style="background:linear-gradient(90deg,rgba(255,0,255,.2),rgba(0,255,255,.2));border-color:rgba(255,0,255,.5)">🎁 Промокоды</button>' +
      '<button class="btn danger" onclick="logoutConfirm()">🚪 Выйти из аккаунта</button>' +
      '<button class="btn ghost" onclick="screenReady()">⬅️ Назад</button>'
    );
  };

  window.logoutConfirm = function() {
    showScreen('Выход', 'Ты уверен, что хочешь выйти из аккаунта?<br>Твой рейтинг сохранится.', 
      '<button class="btn danger" id="btnYesLogout">Да, выйти</button>' +
      '<button class="btn ghost" id="btnCancelLogout">Отмена</button>'
    );
    document.getElementById('btnYesLogout').addEventListener('pointerdown', window.doLogout);
    document.getElementById('btnCancelLogout').addEventListener('pointerdown', window.showOtherMenu);
  };

  window.doLogout = function() {
    currentPlayer = '';
    players = {};
    deviceId = physicalDeviceId;
    hideOverlay();
    document.getElementById('startScreen').style.display = 'flex';
    if (canvas) canvas.style.display = 'none';
    document.getElementById('nameInput').value = '';
    document.getElementById('passInput').value = '';
    document.getElementById('loginStatus').textContent = '';
    document.getElementById('loginBtn').textContent = 'ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ';
  };

  // ============ МОРСКОЙ БОЙ (переработан) ============
  
  function bsEmptyGrid() {
    return Array(10).fill().map(function(){ return Array(10).fill(0); });
  }

  window.startBSMenu = function() {
    state = 'bs_menu';
    showScreen('🚢 Морской бой', 'Создай комнату или введи код друга:',
      '<input id="bsRoomInput" class="name-input" maxlength="6" placeholder="Код комнаты" style="text-transform:uppercase;">' +
      '<button class="btn primary" id="btnCreateBS">Создать комнату</button>' +
      '<button class="btn" id="btnJoinBS">Войти по коду</button>' +
      '<button class="btn ghost" onclick="showGamesMenu()">⬅️ Назад</button>'
    );
    document.getElementById('btnCreateBS').addEventListener('pointerdown', window.createBSRoom);
    document.getElementById('btnJoinBS').addEventListener('pointerdown', window.joinBSRoom);
  };

  window.createBSRoom = function() {
    if (!db) { showScreen('Ошибка', 'Нет интернета (Firebase)', '<button class="btn primary" onclick="startBSMenu()">Назад</button>'); return; }
    var code = Math.floor(1000 + Math.random() * 9000).toString();
    bsRoom = 'bs_' + code;
    initBSRoom();
  };

  window.joinBSRoom = function() {
    if (!db) { showScreen('Ошибка', 'Нет интернета (Firebase)', '<button class="btn primary" onclick="startBSMenu()">Назад</button>'); return; }
    var input = document.getElementById('bsRoomInput');
    var code = input ? input.value.trim() : '';
    if (code.length < 4) { showScreen('Ошибка', 'Введи 4-значный код комнаты', '<button class="btn primary" onclick="startBSMenu()">Назад</button>'); return; }
    bsRoom = 'bs_' + code;
    initBSRoom();
  };

  function initBSRoom() {
    bsState = 'waiting';
    bsMyGrid = bsEmptyGrid();
    bsEnemyGrid = bsEmptyGrid();
    bsMyShips = [];
    bsMyHits = 0;
    bsEnemyHits = 0;
    bsIsMyTurn = false;
    bsView = 'enemy';
    bsGameOverShown = false;

    if (bsPollTimer) { clearInterval(bsPollTimer); bsPollTimer = null; }
    if (bsRoomRef) { try { bsRoomRef.off(); } catch(e) {} }

    bsRoomRef = db.ref('bs_rooms/' + bsRoom);
    bsRoomRef.child('players/' + deviceId).update({ name: currentPlayer, ready: false });
    bsRoomRef.child('players/' + deviceId).onDisconnect().remove();

    showScreen('Комната: ' + bsRoom.replace('bs_', ''), 'Ожидание второго игрока...', '<button class="btn danger" id="btnLeaveBS1">Выйти</button>');
    document.getElementById('btnLeaveBS1').addEventListener('pointerdown', window.leaveBS);

    // Основной слушатель (реальное время)
    bsRoomRef.on('value', function(snap) {
      bsProcessState(snap.val());
    });

    // Сторожевой таймер — каждую секунду принудительно проверяет состояние
    bsPollTimer = setInterval(function() {
      if (!bsRoomRef) return;
      if (bsState === 'menu' || bsState === 'over') {
        if (bsPollTimer) { clearInterval(bsPollTimer); bsPollTimer = null; }
        return;
      }
      bsRoomRef.once('value').then(function(snap) {
        bsProcessState(snap.val());
      }).catch(function(){});
    }, 1000);

    bsDraw();
  }

  function bsProcessState(data) {
    if (!data || !data.players) {
      if (bsState === 'playing' || bsState === 'placing' || bsState === 'waiting') {
        // Соперник вышел, либо комната пуста — но мы сами там? Если мы сами там, players будет содержать нас.
        // Значит комната реально пуста — выходим.
        return;
      }
      return;
    }
    
    var pIds = Object.keys(data.players);
    var pCount = pIds.length;

    // 1. КРИТИЧНО: если статус 'playing' — принудительно входим в игру
    if (data.status === 'playing' && bsState !== 'playing' && bsState !== 'over') {
      bsState = 'playing';
      hideOverlay();
    }

    // 2. Если игра идёт и соперник отключился
    if ((bsState === 'playing' || bsState === 'placing') && pCount < 2) {
      bsState = 'menu';
      if (bsPollTimer) { clearInterval(bsPollTimer); bsPollTimer = null; }
      showScreen('Игра окончена', 'Соперник покинул игру.', '<button class="btn primary" id="bsBackBtn">В меню</button>');
      var b1 = document.getElementById('bsBackBtn');
      if (b1) b1.addEventListener('pointerdown', window.showGamesMenu);
      return;
    }

    // 3. Переход: ждём → расстановка, когда 2 игрока
    if (bsState === 'waiting' && pCount === 2) {
      bsState = 'placing';
      prepareBSShips();
      bsView = 'my';
      showScreen('Расстановка', 'Твои корабли готовы.<br>Нажми "Готов", чтобы начать.', 
        '<button class="btn primary" id="btnBSReady">Готов</button>' +
        '<button class="btn" id="btnBSShuffle">Перемешать</button>'
      );
      var b2 = document.getElementById('btnBSReady');
      if (b2) b2.addEventListener('pointerdown', window.bsReady);
      var b3 = document.getElementById('btnBSShuffle');
      if (b3) b3.addEventListener('pointerdown', function() {
        window.prepareBSShips();
        window.bsDraw();
      });
    }

    // 4. Автозапуск: если оба готовы — стартуем (независимо от bsState)
    if (pCount === 2 && data.players[pIds[0]] && data.players[pIds[1]] &&
        data.players[pIds[0]].ready && data.players[pIds[1]].ready &&
        data.status !== 'playing' && data.status !== 'over') {
      var sorted = pIds.slice().sort();
      bsRoomRef.update({ status: 'playing', turn: sorted[0] });
    }

    // 5. Обработка выстрелов
    if (data.shots) {
      bsProcessShots(data.shots);
    }

    // 6. Обновление хода
    if (bsState === 'playing') {
      var pending = false;
      if (data.shots) {
        for (var k in data.shots) {
          if (data.shots[k] && data.shots[k].by === deviceId && data.shots[k].status === 'pending') {
            pending = true; break;
          }
        }
      }
      bsIsMyTurn = !pending && (data.turn === deviceId);
      bsDraw();
    }

    // 7. Проверка победы (только один раз)
    if (bsState === 'playing' && bsEnemyHits >= bsTotalShipCells && !bsGameOverShown) {
      bsGameOverShown = true;
      bsState = 'over';
      bsRoomRef.update({ status: 'over', winner: deviceId });
      if (bsPollTimer) { clearInterval(bsPollTimer); bsPollTimer = null; }
      showScreen('🏆 Победа!', 'Вы потопили весь флот врага!', '<button class="btn primary" id="bsBackBtnWin">В меню</button>');
      var b4 = document.getElementById('bsBackBtnWin');
      if (b4) b4.addEventListener('pointerdown', window.leaveBS);
    }
  }

  function bsProcessShots(shots) {
    for (var key in shots) {
      var shot = shots[key];
      if (!shot) continue;
      var parts = key.split('_');
      var sx = parseInt(parts[0]);
      var sy = parseInt(parts[1]);
      if (isNaN(sx) || isNaN(sy) || sx < 0 || sx > 9 || sy < 0 || sy > 9) continue;

      if (shot.by === deviceId) {
        // Мой выстрел — только визуализация
        if (shot.status === 'hit' && bsEnemyGrid[sy][sx] !== 2) {
          bsEnemyGrid[sy][sx] = 2; bsEnemyHits++; beep(600, 0.1, 'square');
        } else if (shot.status === 'miss' && bsEnemyGrid[sy][sx] !== 3) {
          bsEnemyGrid[sy][sx] = 3; beep(300, 0.1, 'sine');
        }
      } else {
        // Выстрел соперника по моему полю
        if (shot.status === 'pending' && bsMyGrid[sy][sx] === 0) {
          if (bsRoomRef) {
            // Проверяем — попали или нет
            var isHit = false;
            // Проверим по сетке: если у меня там корабль (1)
            if (bsMyGrid[sy][sx] === 1) isHit = true;

          }
          // На самом деле проверим нашу сетку: 1 = корабль
          // Но если bsMyGrid[sy][sx] === 0, это пустая клетка → промах
          bsMyGrid[sy][sx] = 3;
          var upd = {};
          upd['shots/' + key + '/status'] = 'miss';
          upd['turn'] = deviceId;
          bsRoomRef.update(upd);
          beep(300, 0.1, 'sine');
        } else if (shot.status === 'pending' && bsMyGrid[sy][sx] === 1) {
          // Попали в мой корабль
          bsMyGrid[sy][sx] = 2;
          bsMyHits++;
          bsRoomRef.child('shots/' + key).update({ status: 'hit' });
          beep(500, 0.1, 'square');
          checkBSDeath();
        } else if (shot.status === 'hit' && bsMyGrid[sy][sx] === 1) {
          bsMyGrid[sy][sx] = 2;
          bsMyHits++;
          checkBSDeath();
        } else if (shot.status === 'miss' && bsMyGrid[sy][sx] === 0) {
          bsMyGrid[sy][sx] = 3;
        }
      }
    }
  }

  window.leaveBS = function() {

      try { bsRoomRef.off(); } catch(e) {}

    bsRoomRef = null;
    bsRoom = '';
    bsState = 'menu';
    bsGameOverShown = false;
    showGamesMenu();
  };
