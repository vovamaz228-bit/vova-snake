<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Онлайн Flappy Bird — Вова (версия 21)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(circle at 50% -10%,#16223f 0%,#080b14 55%,#05070d 100%);
    color:#e8f1ff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100dvh;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #gate{
    position:fixed;inset:0;z-index:9999;
    background:rgba(6,10,20,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #gateCard{
    background:rgba(10,16,30,.98);
    border:1px solid rgba(120,180,255,.35);
    border-radius:18px;padding:24px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 20px 60px -20px rgba(40,140,255,.5);
  }
  #gateCard h2{margin:0 0 6px;color:#fff;font-size:22px}
  #gateCard p.sub{color:#8ea6c9;margin:0 0 16px;font-size:13px}
  .gate-input{
    width:100%;padding:12px;border-radius:12px;
    border:1px solid rgba(120,180,255,.35);
    background:rgba(6,10,20,.9);color:#fff;
    font-size:18px;text-align:center;outline:none;
  }
  .gate-input:focus{border-color:rgba(70,230,160,.7);box-shadow:0 0 0 3px rgba(70,230,160,.15)}
  .gate-input.error{border-color:rgba(255,77,109,.9);animation:shake .3s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }
  #gateBtn{
    width:100%;margin-top:12px;padding:12px;border-radius:12px;border:none;
    background:linear-gradient(90deg,#46e6a0,#3aa8ff);
    color:#06281f;font-size:15px;font-weight:700;cursor:pointer;
  }
  #gateBtn:active{transform:scale(.98)}
  #gateErr{color:#ff4d6d;margin:8px 0 0;font-size:12px;min-height:16px}
  #gateVer{color:#4d6480;margin:4px 0 0;font-size:11px}

  #bg{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
  #bg span{
    font-size:clamp(36px,12vw,150px);font-weight:900;line-height:.92;text-align:center;
    text-transform:uppercase;letter-spacing:.02em;transform:rotate(-12deg);
    color:rgba(255,255,255,.16);text-shadow:0 0 90px rgba(255,255,255,.14);
  }
  #wrap{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:16px;align-items:center}
  #hud{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;
       font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8ea6c9}
  #hud b{color:#fff;font-weight:700;font-size:15px;letter-spacing:0}
  #hudPlayer{color:#46e6a0;font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%}
  #stage{position:relative;line-height:0}
  canvas{display:block;border-radius:18px;touch-action:none;
    box-shadow:0 0 0 1px rgba(120,180,255,.16),0 24px 70px -24px rgba(40,140,255,.75)}
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:20px;text-align:center;border-radius:18px;
    background:rgba(6,10,20,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #overlay.show{opacity:1;pointer-events:auto}
  #ov-title{margin:0;font-size:clamp(20px,5.6vw,28px);
    background:linear-gradient(90deg,#46e6a0,#3aa8ff);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #ov-text{margin:0;font-size:14px;line-height:1.55;color:#a9bfdd;max-height:44vh;overflow:auto;width:100%}
  #ov-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;margin-top:4px}
  .btn{
    appearance:none;border:1px solid rgba(120,180,255,.35);
    background:rgba(70,140,255,.14);color:#e8f1ff;
    padding:10px 18px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s,border-color .15s,transform .08s;
  }
  .btn:hover{background:rgba(70,140,255,.26);border-color:rgba(120,180,255,.6)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,rgba(70,230,160,.3),rgba(58,168,255,.3));border-color:rgba(70,230,160,.5)}
  .btn.ghost{background:transparent;color:#8ea6c9;border-color:rgba(120,180,255,.2)}
  .btn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.45);color:#ffb3c1}
  .btn.wide{width:100%;max-width:260px}
  .name-input{
    width:100%;max-width:260px;padding:12px 14px;border-radius:12px;
    border:1px solid rgba(120,180,255,.35);background:rgba(10,16,30,.85);
    color:#fff;font:inherit;font-size:16px;text-align:center;outline:none;
  }
  .name-input:focus{border-color:rgba(70,230,160,.7);box-shadow:0 0 0 3px rgba(70,230,160,.15)}
  .name-input.error{border-color:rgba(255,77,109,.9);animation:shake .3s}
  .stats{width:100%;border-collapse:collapse;font-size:13px}
  .stats th,.stats td{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(120,180,255,.1)}
  .stats th{color:#8ea6c9;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
            position:sticky;top:0;background:rgba(6,10,20,.95)}
  .stats td{color:#e8f1ff}
  .stats tbody tr:first-child td{color:#46e6a0;font-weight:700}
  .stats td.num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="gate">
  <div id="gateCard">
    <h2>Вход по коду</h2>
    <p class="sub">Введите код доступа</p>
    <input id="gateInput" class="gate-input" type="text" inputmode="numeric"
           autocomplete="off" autocapitalize="off" placeholder="Код" autofocus>
    <button id="gateBtn" type="button">Войти</button>
    <p id="gateErr"></p>
    <p id="gateVer">версия 21</p>
  </div>
</div>

<div id="bg"><span>Вова<br>разработчик<br>этой игры</span></div>

<div id="wrap">
  <div id="hud">
    <span id="hudPlayer">—</span>
    <span>Счёт <b id="score">0</b></span>
    <span>Рекорд <b id="best">0</b></span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1 id="ov-title">Игра</h1>
      <p id="ov-text"></p>
      <div id="ov-actions"></div>
    </div>
  </div>
</div>

<script>
/* ============ ЧАСТЬ 1: КОД ДОСТУПА ============ */
(function() {
  var CORRECT = '12345789';
  var gate = document.getElementById('gate');
  var input = document.getElementById('gateInput');
  var btn = document.getElementById('gateBtn');
  var err = document.getElementById('gateErr');

  function check() {
    if ((input.value || '').trim() === CORRECT) {
      gate.style.display = 'none';
      input.value = '';
      err.textContent = '';
      if (typeof window.__gameReady === 'function') window.__gameReady();
    } else {
      input.value = '';
      input.classList.add('error');
      err.style.color = '#ff4d6d';
      err.textContent = 'Неверный код';
      setTimeout(function() {
        input.classList.remove('error');
        err.textContent = '';
      }, 900);
    }
  }

  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); check(); }
  });

  window.__showGate = function() {
    input.value = '';
    err.textContent = '';
    gate.style.display = 'flex';
    setTimeout(function(){ input.focus(); }, 50);
  };
})();

/* ============ ЧАСТЬ 2: ИГРА ============ */
(function() {
  'use strict';

  var FIREBASE_BASE = 'https://vova-snake-420c6-default-rtdb.firebaseio.com/'; 

  var GRID = 20;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text');
  var ovActions = document.getElementById('ov-actions');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var hudPlayer = document.getElementById('hudPlayer');

  var players = {};
  var currentPlayer = '';
  var state = 'name';
  var currentScreen = null;

  var deviceId = localStorage.getItem('snake.deviceId');
  if (!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    localStorage.setItem('snake.deviceId', deviceId);
  }

  var px = 400, cell = 20;
  var particles = [];
  var loopStarted = false;
  var lastTime = 0;

  var snake, dir, queue, food, score, acc, stepMs;
  var flappyBird = { x: 50, y: 150, vy: 0, gravity: 0.25, jump: -4.5, size: 20 };
  var flappyPipes = [];
  var flappyScore = 0;
  var flappyState = 'ready';
  var flappySpeed = 2;

  var onlineRoom = '';
  var onlineData = null;
  var onlineInterval = null;
  var onlineBirdY = 150;
  var onlineBirdVy = 0;
  var onlineStartTime = 0;
  var onlinePipes = [];
  var onlineScore = 0;
  var onlineState = 'waiting'; 

  function savePlayers() { try { localStorage.setItem('snake.players.v2', JSON.stringify(players)); } catch (e) {} }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(ts) {
    var d = new Date(ts), n = new Date();
    return d.toDateString() === n.toDateString()
      ? d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
      : d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
  }

  var actx = null;
  function beep(freq, dur, type, vol) {
    type = type || 'sine'; vol = vol || 0.05;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function showScreen(title, textHTML, actionsHTML) {
    ovTitle.textContent = title;
    ovText.innerHTML = textHTML;
    ovActions.innerHTML = actionsHTML;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function updateHud() {
    hudPlayer.textContent = currentPlayer || '—';
    var p = players[currentPlayer];
    bestEl.textContent = p ? p.best : 0;
    scoreEl.textContent = score || 0;
  }

  function logout() {
    if (!confirm('Выйти из аккаунта?')) return;
    players = {};
    currentPlayer = '';
    localStorage.removeItem('snake.players.v2');
    localStorage.removeItem('snake.lastPlayer.v2');
    resetGame();
    score = 0;
    updateHud();
    hideOverlay();
    if (typeof window.__showGate === 'function') window.__showGate();
    state = 'name';
  }

  function screenName() {
    state = 'name';
    currentScreen = screenName;
    var last = localStorage.getItem('snake.lastPlayer.v2') || '';
    showScreen(
      'Кто играет?',
      '<p class="menu-hint">Введи имя</p>',
      '<form id="nameForm" style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%">' +
        '<input id="nameInput" class="name-input" maxlength="16" placeholder="Имя" ' +
          'autocomplete="off" autocapitalize="words" value="' + esc(last) + '">' +
        '<button type="submit" class="btn ghost wide" id="btnMenuName">Меню</button>' +
      '</form>'
    );
    document.getElementById('nameForm').addEventListener('submit', function(ev) {
      ev.preventDefault();
      var name = document.getElementById('nameInput').value.trim().replace(/\s+/g, ' ').slice(0, 16);
      if (!name) return;
      setPlayer(name);
    });
    if (!('ontouchstart' in window)) document.getElementById('nameInput').focus();
  }

  function setPlayer(name) {
    currentPlayer = name;
    localStorage.setItem('snake.lastPlayer.v2', name);
    if (!players[name]) {
      players[name] = { games: 0, best: 0, total: 0, last: 0 };
      savePlayers();
    }
    resetGame();
    updateHud();
    screenReady();
  }

  function screenReady() {
    state = 'ready';
    currentScreen = screenReady;
    showScreen(
      'Меню игр',
      'Игрок: <b style="color:#fff">' + esc(currentPlayer) + '</b>',
      '<button class="btn primary" id="btnPlaySnake">Играть (Змейка)</button>' +
      '<button class="btn primary" id="btnPlayFlappy" style="background:linear-gradient(90deg,rgba(255,200,50,.3),rgba(255,100,50,.3));border-color:rgba(255,200,50,.5)">Играть (Flappy)</button>' +
      '<button class="btn" id="btnPlayOnline" style="background:linear-gradient(90deg,rgba(200,50,255,.3),rgba(100,50,255,.3));border-color:rgba(200,50,255,.5)">🌐 Онлайн Flappy (с другом)</button>' +
      '<button class="btn" id="btnStatsSnake">🌍 Рейтинг Змейки</button>' +
      '<button class="btn" id="btnStatsFlappy">🐦 Рейтинг Flappy</button>' +
      '<button class="btn danger" id="btnLogoutReady">Выйти из аккаунта</button>'
    );
    document.getElementById('btnPlaySnake').addEventListener('click', startSnake);
    document.getElementById('btnPlayFlappy').addEventListener('click', startFlappy);
    document.getElementById('btnPlayOnline').addEventListener('click', showOnlineLobby);
    document.getElementById('btnStatsSnake').addEventListener('click', function() { showGlobalStats('snake'); });
    document.getElementById('btnStatsFlappy').addEventListener('click', function() { showGlobalStats('flappy'); });
    document.getElementById('btnLogoutReady').addEventListener('click', logout);
  }

  function showGlobalStats(gameType) {
    var prevState = state;
    var prevScreen = currentScreen;
    state = 'globalstats';
    currentScreen = showGlobalStats;
    
    var returnFromStats = function() {
      state = prevState;
      currentScreen = prevScreen;
      if (prevScreen) prevScreen();
    };

    var url = FIREBASE_BASE + 'scores/' + gameType + '.json';
    var gameName = gameType === 'snake' ? 'Змейка' : 'Flappy Bird';

    showScreen('Рейтинг: ' + gameName, '<div style="color:#8ea6c9;padding:16px">Загрузка...</div>', '<button class="btn primary" id="btnBack">Назад</button>');
    document.getElementById('btnBack').addEventListener('click', returnFromStats);

    fetch(url).then(res => res.json()).then(data => {
        var bestByName = {};
        if (data) {
          for (var key in data) {
            var entry = data[key];
            if (entry && entry.name) {
              var lowerName = entry.name.toLowerCase();
              if (!bestByName[lowerName] || entry.score > bestByName[lowerName].score) {
                bestByName[lowerName] = entry;
              }
            }
          }
        }
        var list = Object.keys(bestByName).map(function(k){ return bestByName[k]; });
        list.sort(function(a, b) { return b.score - a.score; });
        
        var body = '';
        if (list.length === 0) body = '<div style="color:#8ea6c9;padding:16px">Пока пусто</div>';
        else {
          var rows = list.map(function(p, i) {
            return '<tr><td class="num" style="color:#8ea6c9">' + (i + 1) + '</td>' +
              '<td>' + esc(p.name) + (p.name.toLowerCase() === currentPlayer.toLowerCase() ? ' (ты)' : '') + '</td>' +
              '<td class="num" style="color:#46e6a0;font-weight:700;">' + p.score + '</td>' +
              '<td class="num" style="color:#8ea6c9;font-size:11px">' + fmtDate(p.time) + '</td></tr>';
          }).join('');
          body = '<table class="stats"><thead><tr><th>#</th><th>Игрок</th><th style="text-align:right">Рекорд</th><th style="text-align:right">Когда</th></tr></thead><tbody>' + rows + '</tbody></table>';
        }
        showScreen('Рейтинг: ' + gameName, body, '<button class="btn primary" id="btnBack2">Назад</button>');
        document.getElementById('btnBack2').addEventListener('click', returnFromStats);
      }).catch(err => {
        showScreen('Ошибка', 'Нет интернета', '<button class="btn primary" id="btnBack3">Назад</button>');
        document.getElementById('btnBack3').addEventListener('click', returnFromStats);
      });
  }

  /* ================= ОНЛАЙН ЛОББИ ================= */
  function showOnlineLobby() {
    state = 'lobby';
    currentScreen = showOnlineLobby;
    showScreen(
      'Онлайн Flappy Bird',
      'Создай комнату или введи код друга, чтобы играть вместе.',
      '<input id="roomInput" class="name-input" placeholder="Код комнаты (напр. 1234)" maxlength="6" style="margin-bottom:10px;text-transform:uppercase;">' +
      '<button class="btn primary" id="btnJoinRoom">Войти в комнату</button>' +
      '<button class="btn ghost" id="btnBackLobby">Назад</button>'
    );
    document.getElementById('btnJoinRoom').addEventListener('click', function() {
      var room = document.getElementById('roomInput').value.trim().toUpperCase();
      if (room.length < 3) return alert('Введи код подлиннее');
      joinRoom(room);
    });
    document.getElementById('btnBackLobby').addEventListener('click', function() {
      if (onlineInterval) { clearInterval(onlineInterval); onlineInterval = null; }
      screenReady();
    });
  }

  function joinRoom(roomName) {
    onlineRoom = roomName;
    state = 'online';
    currentScreen = renderLobbyWaiting;
    
    showScreen('Комната: ' + onlineRoom, 'Подключение...', '<button class="btn danger" id="btnQuitLobby">Отмена</button>');
    document.getElementById('btnQuitLobby').addEventListener('click', leaveRoom);

    fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/players/' + deviceId + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: currentPlayer, y: 150, score: 0, alive: true })
    }).then(() => {
      // Как только зашли, принудительно сбрасываем статус в 'waiting'
      // чтобы не влететь в старую игру
      fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/status.json', {
          method: 'PUT',
          body: JSON.stringify('waiting')
      }).then(() => {
          if (onlineInterval) clearInterval(onlineInterval);
          onlineInterval = setInterval(updateOnlineLobby, 1000);
          updateOnlineLobby(); 
      });
    });
  }

  function updateOnlineLobby() {
    fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '.json')
      .then(res => res.json())
      .then(data => {
        onlineData = data || {};
        
        // Защита от "зомби-комнат" (старых зависших игр)
        if (onlineData.status === 'playing' && onlineState === 'waiting') {
          var timeSinceStart = Date.now() - (onlineData.startTime || 0);
          
          if (timeSinceStart > 5000) {
              // Если игра началась больше 5 секунд назад, а мы только зашли — сбрасываем её
              fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/status.json', {
                  method: 'PUT',
                  body: JSON.stringify('waiting')
              });
              onlineData.status = 'waiting';
          } else {
              // Игра началась только что, подключаемся
              onlineState = 'playing';
              onlineStartTime = onlineData.startTime;
              onlineBirdY = px / 2;
              onlineBirdVy = 0;
              onlineScore = 0;
              onlinePipes = [];
              hideOverlay();
              return;
          }
        }

        // Отправляем свои координаты, если играем
        if (onlineState === 'playing') {
          fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/players/' + deviceId + '.json', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ y: onlineBirdY, score: onlineScore })
          }).catch(e => {});
        }

        // Отрисовываем лобби
        if (state === 'online' && onlineState === 'waiting' && currentScreen === renderLobbyWaiting) {
          renderLobbyWaiting();
        }
      }).catch(e => { console.log('Ошибка сети', e); });
  }

  function renderLobbyWaiting() {
    if (!onlineData || !onlineData.players) return;
    
    var pCount = Object.keys(onlineData.players).length;
    var playerList = '';
    for (var k in onlineData.players) {
      playerList += '<div style="color:#46e6a0; font-weight:bold; margin:4px 0;">🐦 ' + esc(onlineData.players[k].name) + '</div>';
    }

    var actions = '';
    if (pCount >= 2) {
        actions += '<button class="btn primary" id="btnStartOnline">Начать игру</button>';
    } else {
        actions += '<button class="btn primary" disabled style="opacity:0.5;cursor:not-allowed;">Ожидание друга...</button>';
    }
    actions += '<button class="btn danger" id="btnQuitLobby">Выйти</button>';

    showScreen(
      'Комната: ' + onlineRoom,
      'Игроков в комнате: <b>' + pCount + '</b><br><br>' + playerList + '<br><span style="font-size:12px;color:#8ea6c9">Ждем начала...</span>',
      actions
    );

    if (pCount >= 2) {
        document.getElementById('btnStartOnline').addEventListener('click', function() {
          fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '.json', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'playing', startTime: Date.now() })
          });
        });
    }

    document.getElementById('btnQuitLobby').addEventListener('click', leaveRoom);
  }

  function leaveRoom() {
    if (onlineRoom) {
      fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/players/' + deviceId + '.json', { method: 'DELETE' });
    }
    if (onlineInterval) { clearInterval(onlineInterval); onlineInterval = null; }
    onlineState = 'waiting';
    onlineData = null;
    screenReady();
  }

  /* ================= ИГРА: ОНЛАЙН FLAPPY ================= */
  function updateOnlineFlappy(dt) {
    if (onlineState !== 'playing' || !onlineData) return;

    onlineBirdVy += 0.25 * (dt / 16);
    onlineBirdY += onlineBirdVy * (dt / 16);

    if (onlineBirdY < 0) { onlineBirdY = 0; onlineBirdVy = 0; }
    if (onlineBirdY + 20 > px) {
       onlineBirdY = px - 20;
       return dieOnlineFlappy();
    }

    var timeElapsed = Date.now() - onlineStartTime;
    var pipeSpacing = 1500;
    var pipeSpeed = 0.15;
    
    onlinePipes = [];
    var currentPipeIndex = Math.floor(timeElapsed / pipeSpacing);
    
    for (var i = currentPipeIndex - 1; i <= currentPipeIndex + 2; i++) {
        if (i < 0) continue;
        
        var spawnTime = i * pipeSpacing;
        var pipeX = px - (timeElapsed - spawnTime) * pipeSpeed;
        
        if (pipeX > -px * 0.2 && pipeX < px + 10) {
            var seed = i * 12345;
            var pseudoRandom = Math.abs(Math.sin(seed)) * 10000;
            var rand = pseudoRandom - Math.floor(pseudoRandom);
            
            var gap = px * 0.35;
            var topH = px * 0.1 + rand * (px - gap - px * 0.25);
            
            onlinePipes.push({ x: pipeX, topH: topH, id: i });
            
            if (pipeX < 50 && !window['passed_' + i]) {
               window['passed_' + i] = true;
               onlineScore++;
               beep(800, 0.05, 'sine', 0.05);
            }

            var pWidth = px * 0.15;
            if (50 + 20 > pipeX && 50 < pipeX + pWidth) {
                if (onlineBirdY < topH || onlineBirdY + 20 > topH + gap) {
                    return dieOnlineFlappy();
                }
            }
        }
    }
  }

  function dieOnlineFlappy() {
    if (onlineState !== 'playing') return;
    onlineState = 'over';
    beep(150, 0.4, 'sawtooth', 0.07);
    
    fetch(FIREBASE_BASE + 'rooms/' + onlineRoom + '/players/' + deviceId + '.json', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ alive: false })
    });

    showScreen(
      'Ты упал!',
      'Твой счёт: <b>' + onlineScore + '</b><br>Ждем остальных...',
      '<button class="btn primary" id="btnQuitOnline">Выйти в меню</button>'
    );
    document.getElementById('btnQuitOnline').addEventListener('click', leaveRoom);
  }

  function drawOnlineFlappy() {
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, px, px);

    var pWidth = px * 0.15;
    ctx.fillStyle = '#73bf2e';
    ctx.strokeStyle = '#558c22';
    ctx.lineWidth = 3;
    for (var i = 0; i < onlinePipes.length; i++) {
      var p = onlinePipes[i];
      ctx.fillRect(p.x, 0, pWidth, p.topH);
      ctx.strokeRect(p.x, 0, pWidth, p.topH);
      var botH = px - (p.topH + px * 0.35);
      ctx.fillRect(p.x, px - botH, pWidth, botH);
      ctx.strokeRect(p.x, px - botH, pWidth, botH);
    }

    if (onlineData && onlineData.players) {
      for (var pid in onlineData.players) {
        if (pid === deviceId) continue;
        var op = onlineData.players[pid];
        if (op.alive) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(50 + 10, op.y + 10, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          
          ctx.fillStyle = '#fff';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(op.name, 60, op.y - 10);
        }
      }
    }

    ctx.fillStyle = '#fadd44';
    ctx.strokeStyle = '#d4a31d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(50 + 10, onlineBirdY + 10, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold ' + (px * 0.1) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.strokeText(onlineScore, px / 2, px * 0.1);
    ctx.fillText(onlineScore, px / 2, px * 0.1);
  }

  /* ================= ИГРА: ОДИНОЧНЫЕ РЕЖИМЫ ================= */
  function resetGame() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1, y:0};
    queue = [];
    particles = [];
    score = 0;
    stepMs = 150;
    acc = 0;
    spawnFood();
  }

  function startSnake() {
    resetGame();
    state = 'play';
    hideOverlay();
    acc = 0;
    updateHud();
  }

  function startFlappy() {
    state = 'flappy';
    flappyState = 'ready';
    flappyBird.y = px / 2 - 20;
    flappyBird.vy = 0;
    flappyPipes = [];
    flappyScore = 0;
    hideOverlay();
    showScreen('Flappy Bird', 'Нажимай, чтобы лететь', '<button class="btn primary" id="btnFlappyStart">Погнали!</button>');
    document.getElementById('btnFlappyStart').addEventListener('click', function() {
      flappyState = 'playing';
      hideOverlay();
    });
  }

  function spawnFood() {
    var free = [];
    for (var y = 0; y < GRID; y++)
      for (var x = 0; x < GRID; x++)
        if (!snake.some(function(s){ return s.x === x && s.y === y; })) free.push({x:x, y:y});
    food = free.length ? free[(Math.random() * free.length) | 0] : {x:0, y:0};
  }

  function setDir(d) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -d.x && last.y === -d.y) return;
    if (last.x === d.x && last.y === d.y) return;
    if (queue.length < 2) queue.push(d);
  }

  function stepSnake() {
    if (state !== 'play') return;
    if (queue.length) dir = queue.shift();
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return dieSnake();
    var grow = (head.x === food.x && head.y === food.y);
    var body = grow ? snake : snake.slice(0, -1);
    if (body.some(function(s){ return s.x === head.x && s.y === head.y; })) return dieSnake();
    snake.unshift(head);
    if (grow) {
      score++; scoreEl.textContent = score;
      stepMs = Math.max(62, 150 - score * 4);
      burst((food.x + 0.5) * cell, (food.y + 0.5) * cell, '#ff4d6d', 16);
      spawnFood(); beep(680, 0.09, 'triangle', 0.05);
    } else snake.pop();
  }

  function updateFlappy(dt) {
    if (state !== 'flappy' || flappyState !== 'playing') return;
    flappyBird.vy += flappyBird.gravity * (dt / 16);
    flappyBird.y += flappyBird.vy * (dt / 16);
    if (flappyBird.y < 0) { flappyBird.y = 0; flappyBird.vy = 0; }
    if (flappyBird.y + flappyBird.size > px) return dieFlappy();
    
    if (flappyPipes.length === 0 || flappyPipes[flappyPipes.length - 1].x < px - px * 0.6) {
      var gap = px * 0.35;
      var topH = px * 0.1 + Math.random() * (px - gap - px * 0.25);
      flappyPipes.push({ x: px, topH: topH, passed: false });
    }
    for (var i = flappyPipes.length - 1; i >= 0; i--) {
      var p = flappyPipes[i];
      p.x -= flappySpeed * (dt / 16);
      if (!p.passed && p.x + px * 0.15 < flappyBird.x) { p.passed = true; flappyScore++; beep(800, 0.05, 'sine', 0.05); }
      if (p.x + px * 0.15 < 0) { flappyPipes.splice(i, 1); continue; }
      if (flappyBird.x + flappyBird.size > p.x && flappyBird.x < p.x + px * 0.15) {
        if (flappyBird.y < p.topH || flappyBird.y + flappyBird.size > p.topH + px * 0.35) return dieFlappy();
      }
    }
  }

  function dieSnake() {
    if (state !== 'play') return;
    state = 'over';
    var h = snake[0];
    burst((h.x + 0.5) * cell, (h.y + 0.5) * cell, '#ff4d6d', 26);
    beep(150, 0.45, 'sawtooth', 0.07);
    sendScoreToServer('snake', score);
    showScreen('Змейка: Игра окончена', 'Счёт: <b>' + score + '</b>', '<button class="btn primary" id="btnAgain">Ещё раз</button><button class="btn" id="btnMenuOver">Меню</button>');
    document.getElementById('btnAgain').addEventListener('click', startSnake);
    document.getElementById('btnMenuOver').addEventListener('click', screenReady);
  }

  function dieFlappy() {
    flappyState = 'over';
    beep(150, 0.4, 'sawtooth', 0.07);
    sendScoreToServer('flappy', flappyScore);
    showScreen('Flappy: Игра окончена', 'Счёт: <b>' + flappyScore + '</b>', '<button class="btn primary" id="btnAgainF">Ещё раз</button><button class="btn" id="btnMenuF">Меню</button>');
    document.getElementById('btnAgainF').addEventListener('click', startFlappy);
    document.getElementById('btnMenuF').addEventListener('click', screenReady);
  }

  function sendScoreToServer(gameType, finalScore) {
    if (!finalScore) return;
    var url = FIREBASE_BASE + 'scores/' + gameType + '/' + deviceId + '.json';
    fetch(url).then(res => res.json()).then(ex => {
       if (!ex || finalScore > ex.score) {
           fetch(url, {
               method: 'PUT',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ name: currentPlayer, score: finalScore, time: Date.now() })
           });
       }
    });
  }

  function burst(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2, sp = (0.03 + Math.random() * 0.13) * (cell / 20);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cell * 0.06, life: 500, max: 700, color: color });
    }
  }

  function draw() {
    if (state === 'online' && (onlineState === 'playing' || onlineState === 'over')) {
      drawOnlineFlappy(); return;
    }
    if (state === 'flappy') {
      ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, px, px);
      var pWidth = px * 0.15; ctx.fillStyle = '#73bf2e'; ctx.strokeStyle = '#558c22'; ctx.lineWidth = 3;
      for (var i = 0; i < flappyPipes.length; i++) {
        var p = flappyPipes[i];
        ctx.fillRect(p.x, 0, pWidth, p.topH); ctx.strokeRect(p.x, 0, pWidth, p.topH);
        var botH = px - (p.topH + px * 0.35); ctx.fillRect(p.x, px - botH, pWidth, botH); ctx.strokeRect(p.x, px - botH, pWidth, botH);
      }
      ctx.fillStyle = '#fadd44'; ctx.beginPath(); ctx.arc(flappyBird.x + 10, flappyBird.y + 10, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (px * 0.1) + 'px Arial'; ctx.textAlign = 'center'; ctx.fillText(flappyScore, px / 2, px * 0.1);
      return;
    }
    if (!snake) return;
    ctx.fillStyle = '#0c1224'; ctx.fillRect(0, 0, px, px);
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i]; ctx.fillStyle = i === 0 ? '#46e6a0' : '#298f62';
      ctx.beginPath(); ctx.arc((s.x + 0.5) * cell, (s.y + 0.5) * cell, cell * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.33, 0, Math.PI * 2); ctx.fill();
  }

  function resize() {
    var w = Math.min(window.innerWidth - 32, 560);
    var h = window.innerHeight - 130;
    px = Math.max(200, Math.floor(Math.min(w, h)));
    cell = px / GRID;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(px * dpr); canvas.height = Math.round(px * dpr);
    canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    var dt = Math.min(100, t - lastTime); lastTime = t;
    
    if (state === 'play') {
      acc += dt; var guard = 0;
      while (state === 'play' && acc >= stepMs && guard++ < 5) { acc -= stepMs; stepSnake(); }
    } else if (state === 'flappy') {
      updateFlappy(dt);
    } else if (state === 'online' && onlineState === 'playing') {
      updateOnlineFlappy(dt);
    }
    
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
      e.preventDefault();
      if (state === 'flappy' && flappyState === 'playing') { flappyBird.vy = flappyBird.jump; beep(400, 0.05); }
      if (state === 'online' && onlineState === 'playing') { onlineBirdVy = -4.5; beep(400, 0.05); }
    }
    if (state === 'play') {
      var map = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}, w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}};
      var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (map[k]) { e.preventDefault(); setDir(map[k]); }
    }
  });

  canvas.addEventListener('mousedown', function() {
    if (state === 'flappy' && flappyState === 'playing') { flappyBird.vy = flappyBird.jump; beep(400, 0.05); }
    if (state === 'online' && onlineState === 'playing') { onlineBirdVy = -4.5; beep(400, 0.05); }
  });

  canvas.addEventListener('touchstart', function(e) {
    if (state === 'flappy' && flappyState === 'playing') { e.preventDefault(); flappyBird.vy = flappyBird.jump; beep(400, 0.05); }
    if (state === 'online' && onlineState === 'playing') { e.preventDefault(); onlineBirdVy = -4.5; beep(400, 0.05); }
  }, {passive: false});

  window.addEventListener('resize', resize);

  try { players = JSON.parse(localStorage.getItem('snake.players.v2') || '{}') || {}; } catch (e) { players = {}; }
  
  resetGame(); updateHud(); resize(); screenName();

  window.__gameReady = function() {
    if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
    if (!currentPlayer) screenName();
    else if (state === 'name' && currentScreen === screenName) screenName();
  };
})();
</script>
