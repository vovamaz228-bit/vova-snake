<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Морской бой онлайн</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #080d18;
      color: #e8f1ff;
      font: 16px system-ui, sans-serif;
    }
    main { max-width: 900px; margin: auto; }
    h1 { color: #46e6a0; }
    button, input {
      padding: 10px 14px;
      border: 1px solid #466083;
      border-radius: 10px;
      background: #121d30;
      color: white;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { background: #1d3150; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    input { width: 150px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .panel {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid #263b5c;
      border-radius: 14px;
      background: #0d1524;
    }
    #status { min-height: 24px; color: #ffd166; }
    #boards { display: flex; flex-wrap: wrap; gap: 28px; }
    .board-wrap { min-width: 280px; }
    .board {
      display: grid;
      grid-template-columns: repeat(10, 28px);
      gap: 3px;
      margin-top: 10px;
    }
    .cell {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid #426083;
      background: #142b46;
      font-size: 14px;
      line-height: 1;
    }
    .cell.ship { background: #54657c; }
    .cell.hit { background: #b8324a; }
    .cell.miss { background: #263548; color: #91a8c5; }
    .cell.target { background: #155b63; }
    .small { color: #9bb0cc; font-size: 13px; }
    @media (max-width: 650px) {
      body { padding: 12px; }
      .board { grid-template-columns: repeat(10, min(8vw, 28px)); gap: 2px; }
      .cell { width: min(8vw, 28px); height: min(8vw, 28px); }
    }
  </style>
</head>
<body>
<main>
  <h1>Морской бой</h1>

  <section class="panel">
    <div class="row">
      <button id="createBtn">Создать игру</button>
      <input id="roomInput" maxlength="8" placeholder="Код комнаты">
      <button id="joinBtn">Войти по коду</button>
    </div>
    <p class="small">Создай комнату и передай её код второму игроку.</p>
    <div id="roomLabel"></div>
    <div id="status">Подключение к серверу…</div>
    <button id="readyBtn" hidden>ГОТОВ</button>
  </section>

  <section id="boards" hidden>
    <div class="board-wrap">
      <b>Моё поле</b>
      <div class="small">Серые клетки — ваши корабли</div>
      <div id="myBoard" class="board"></div>
    </div>
    <div class="board-wrap">
      <b>Поле соперника</b>
      <div class="small">Нажмите клетку, чтобы выстрелить</div>
      <div id="enemyBoard" class="board"></div>
    </div>
  </section>
</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // Вставьте сюда настройки своего Firebase-проекта.
  const firebaseConfig = {
    apiKey: "ВСТАВЬТЕ_API_KEY",
    authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
    databaseURL: "https://ВАШ_ПРОЕКТ-default-rtdb.firebaseio.com",
    projectId: "ВАШ_ПРОЕКТ",
    appId: "ВСТАВЬТЕ_APP_ID"
  };

  const statusEl = document.getElementById("status");
  const roomLabel = document.getElementById("roomLabel");
  const readyBtn = document.getElementById("readyBtn");
  const boardsEl = document.getElementById("boards");
  const myBoardEl = document.getElementById("myBoard");
  const enemyBoardEl = document.getElementById("enemyBoard");

  let db;
  let roomId = "";
  let playerId = sessionStorage.getItem("battleshipPlayerId");

  if (!playerId) {
    playerId = "p_" + Math.random().toString(36).slice(2, 12);
    sessionStorage.setItem("battleshipPlayerId", playerId);
  }

  let roomData = null;
  let roomListener = null;
  let busy = false;

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    statusEl.textContent = "Подключено. Создайте комнату или введите её код.";
  } catch (e) {
    statusEl.textContent = "Не удалось подключиться к Firebase. Проверьте firebaseConfig.";
  }

  function makeBoard() {
    const board = Array(100).fill(0);
    const ships = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];

    for (const length of ships) {
      let placed = false;
      let tries = 0;

      while (!placed && tries++ < 2000) {
        const horizontal = Math.random() < 0.5;
        const row = Math.floor(Math.random() * 10);
        const col = Math.floor(Math.random() * 10);

        if (horizontal && col + length > 10) continue;
        if (!horizontal && row + length > 10) continue;

        const cells = [];
        for (let i = 0; i < length; i++) {
          cells.push(horizontal ? row * 10 + col + i : (row + i) * 10 + col);
        }
        if (cells.some(index => board[index] === 1)) continue;

        cells.forEach(index => board[index] = 1);
        placed = true;
      }

      if (!placed) return makeBoard();
    }
    return board;
  }

  function roomRef() {
    return db.ref("battleshipRooms/" + roomId);
  }

  function showError(error) {
    statusEl.textContent = "Ошибка: " + (error?.message || error);
    busy = false;
  }

  async function createRoom() {
    if (!db || busy) return;
    busy = true;
    statusEl.textContent = "Создаём комнату…";

    try {
      let code, ref, snap;
      do {
        code = Math.random().toString(36).slice(2, 7).toUpperCase();
        ref = db.ref("battleshipRooms/" + code);
        snap = await ref.once("value");
      } while (snap.exists());

      roomId = code;
      await ref.set({
        status: "waiting",
        turn: "",
        winner: "",
        players: {
          p1: {
            id: playerId,
            name: "Игрок 1",
            ready: false,
            board: makeBoard(),
            shots: Array(100).fill(0),
            remaining: 20
          }
        }
      });

      busy = false;
      watchRoom();
    } catch (e) {
      showError(e);
    }
  }

  async function joinRoom() {
    if (!db || busy) return;

    const code = document.getElementById("roomInput").value.trim().toUpperCase();
    if (!code) {
      statusEl.textContent = "Введите код комнаты.";
      return;
    }

    busy = true;
    roomId = code;

    try {
      const result = await roomRef().transaction(room => {
        if (!room || room.status !== "waiting") return;
        if (room.players?.p2) return;
        if (room.players?.p1?.id === playerId) return;

        room.players = room.players || {};
        room.players.p2 = {
          id: playerId,
          name: "Игрок 2",
          ready: false,
          board: makeBoard(),
          shots: Array(100).fill(0),
          remaining: 20
        };
        return room;
      });

      if (!result.committed) {
        roomId = "";
        busy = false;
        statusEl.textContent = "Комната не найдена, уже заполнена или игра уже началась.";
        return;
      }

      busy = false;
      watchRoom();
    } catch (e) {
      roomId = "";
      showError(e);
    }
  }

  function watchRoom() {
    if (roomListener) roomRef().off("value", roomListener);

    roomListener = snapshot => {
      roomData = snapshot.val();

      if (!roomData) {
        statusEl.textContent = "Комната больше не существует.";
        return;
      }

      const player = getMyPlayer();
      if (!player) {
        statusEl.textContent = "Вы не числитесь игроком в этой комнате.";
        return;
      }

      roomLabel.textContent = "Код комнаты: " + roomId;
      boardsEl.hidden = false;
      drawBoards();

      const players = roomData.players || {};
      const opponent = getOpponent();

      if (roomData.status === "waiting") {
        if (!opponent) {
          statusEl.textContent = "Ждём второго игрока. Передайте ему код комнаты.";
        } else if (!player.ready) {
          statusEl.textContent = "Соперник подключился. Нажмите «ГОТОВ».";
        } else if (!opponent.ready) {
          statusEl.textContent = "Вы готовы. Ждём, пока соперник нажмёт «ГОТОВ».";
        } else {
          statusEl.textContent = "Оба игрока готовы. Запускаем игру…";
        }

        readyBtn.hidden = !opponent || player.ready;
        readyBtn.disabled = busy;
      } else if (roomData.status === "playing") {
        readyBtn.hidden = true;
        statusEl.textContent = roomData.turn === playerId
          ? "Ваш ход — стреляйте по полю соперника."
          : "Ход соперника.";
      } else if (roomData.status === "finished") {
        readyBtn.hidden = true;
        statusEl.textContent = roomData.winner === playerId ? "Вы победили!" : "Вы проиграли.";
      }
    };

    roomRef().on("value", roomListener);
  }

  function getMyPlayer() {
    if (!roomData?.players) return null;
    return Object.values(roomData.players).find(p => p.id === playerId) || null;
  }

  function getOpponent() {
    if (!roomData?.players) return null;
    return Object.values(roomData.players).find(p => p.id !== playerId) || null;
  }

  function drawBoards() {
    const mine = getMyPlayer();
    const enemy = getOpponent();
    if (!mine) return;

    myBoardEl.replaceChildren();
    enemyBoardEl.replaceChildren();

    for (let i = 0; i < 100; i++) {
      const myCell = document.createElement("button");
      myCell.className = "cell";
      myCell.type = "button";
      if (mine.board?.[i]) myCell.classList.add("ship");
      if (mine.shots?.[i]) myCell.classList.add("hit");
      myCell.disabled = true;
      myBoardEl.appendChild(myCell);

      const enemyCell = document.createElement("button");
      enemyCell.className = "cell";
      enemyCell.type = "button";

      if (mine.shots?.[i]) {
        // В shots хранятся все уже обстрелянные клетки.
        const lastShot = roomData.lastShot;
        if (lastShot?.by === playerId && lastShot.cell === i && lastShot.hit) {
          enemyCell.classList.add("hit");
          enemyCell.textContent = "✕";
        } else {
          enemyCell.classList.add("miss");
          enemyCell.textContent = "•";
        }
      } else {
        enemyCell.classList.add("target");
      }

      enemyCell.disabled = roomData.status !== "playing"
        || roomData.turn !== playerId
        || !enemy
        || !!mine.shots?.[i]
        || busy;

      enemyCell.addEventListener("click", () => shoot(i));
      enemyBoardEl.appendChild(enemyCell);
    }

    // Показываем на своём поле попадания соперника.
    const enemyShots = enemy?.shots || [];
    for (let i = 0; i < 100; i++) {
      if (enemyShots[i]) {
        const cell = myBoardEl.children[i];
        cell.classList.remove("ship");
        cell.classList.add(mine.board[i] ? "hit" : "miss");
        cell.textContent = mine.board[i] ? "✕" : "•";
      }
    }
  }

  async function markReady() {
    if (!roomId || busy) return;
    busy = true;
    statusEl.textContent = "Сохраняем готовность…";

    try {
      await roomRef().transaction(room => {
        if (!room || room.status !== "waiting") return;
        const key = Object.keys(room.players || {}).find(k => room.players[k].id === playerId);
        if (!key || !room.players.p1 || !room.players.p2) return;

        room.players[key].ready = true;

        // Проверяем обоих игроков внутри одной транзакции:
        // последний нажавший «ГОТОВ» запускает матч сам.
        if (room.players.p1.ready && room.players.p2.ready) {
          room.status = "playing";
          room.turn = room.players.p1.id;
        }
        return room;
      });

      busy = false;
      if (roomData) drawBoards();
    } catch (e) {
      showError(e);
    }
  }

  async function shoot(cellIndex) {
    if (!roomId || busy || !roomData) return;

    const opponent = getOpponent();
    if (!opponent) return;

    busy = true;
    drawBoards();

    try {
      const result = await roomRef().transaction(room => {
        if (!room || room.status !== "playing" || room.turn !== playerId) return;

        const players = room.players || {};
        const shooterKey = Object.keys(players).find(k => players[k].id === playerId);
        const targetKey = Object.keys(players).find(k => players[k].id !== playerId);
        if (!shooterKey || !targetKey) return;

        const shooter = players[shooterKey];
        const target = players[targetKey];
        shooter.shots = shooter.shots || Array(100).fill(0);

        // Не разрешаем повторно стрелять в ту же клетку.
        if (shooter.shots[cellIndex]) return;

        shooter.shots[cellIndex] = 1;
        const hit = target.board[cellIndex] === 1;

        if (hit) {
          target.remaining = Math.max(0, (target.remaining ?? 20) - 1);
        }

        room.lastShot = {
          by: playerId,
          cell: cellIndex,
          hit: hit,
          time: Date.now()
        };

        if (target.remaining <= 0) {
          room.status = "finished";
          room.winner = playerId;
          room.turn = "";
        } else if (!hit) {
          // При промахе ход переходит сопернику. При попадании ход остаётся.
          room.turn = target.id;
        }

        return room;
      });

      busy = false;
      if (!result.committed) statusEl.textContent = "Выстрел не принят. Проверьте, чей сейчас ход.";
      if (roomData) drawBoards();
    } catch (e) {
      showError(e);
    }
  }

  document.getElementById("createBtn").addEventListener("click", createRoom);
  document.getElementById("joinBtn").addEventListener("click", joinRoom);
  readyBtn.addEventListener("click", markReady);
</script>
</body>
</html>
